    rust_test: "tests/display_parity.rs 가 fixtures::repo_file('tools/display_cases.json') 로 읽어 grid_lines 결과를 정확 비교(g 정수, a f64 정확)"
    note: "스크립트는 src/render/grid.js 를 import → Phase 6 에서 src/ 삭제 시 재생성 불가(JSON 은 남음). phase6.warnings 참조"
  tests:
    - "grid_lines 오라클 전 케이스 일치(순서 포함)"
    - "체커: dpr {1,1.25,1.5,2}에서 셀 크기·위상, 뷰포트 교집합 최적화 == 전체 루프(작은 프레임버퍼 브루트포스 대조)"
    - "배경: transparent / '#rrggbb' / '#rrggbbaa'(a=0 → 체커만, a=128 → 알파 0.502 양자화) / 잘못된 문자열(→ 체커) / non-string"
    - "그리드 4모드 × z∈{0.25,1,2,8,32} 에서 선 위치·두께·베벨 픽셀 단위 단언(작은 뷰 손계산 기대값). D5 리터럴 동작(light 정사각형)을 테스트로 고정하고 주석 1줄"
    - "draw_display 통합: 2×2 comp 한 장, zoom 8 → 8×8 블록 4개 정확, 테두리·그리드 위치. offset 음수(캔버스가 왼쪽 밖으로 나감)·캔버스가 뷰포트보다 작은 경우"
    - "합성식 단위 테스트(source_over, difference_white — 경계 a=0, a=1)"
    - "bench: examples/bench.rs 는 W2 소유 아님 → 1920×1080 draw_display_into 시간은 tests 에서 측정하지 말고(R12) 로그 초안에 수동 측정치만"
