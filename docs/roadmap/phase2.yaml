    - "app/src/input.rs 파사드: `mod event; pub use event::*;` 만. app/src/tools.rs 파사드: `pub mod api; pub mod overlay; pub mod manager; pub mod pen; pub mod fill; pub mod eyedropper; pub mod hand; pub mod shape; pub mod arc; pub mod gradient; pub mod text;` (manager..text 는 빈 파일. 각 소유 작업이 채움) + `pub use api::*;`"
    - "공유 타입 3종 완성(아래 shared_types). `todo!()`/`unimplemented!()` 금지 — 순수 데이터와 작은 헬퍼 + 단위 테스트까지"
  constants_to_add:               # JS 원천 → Rust const. 값은 JS 에서 복사
    - {name: FRAME_BUDGET_MS, value: 6, js: "src/render/renderer_composite.js:5 const FRAME_BUDGET_MS = 6", type: "u64 ms"}
