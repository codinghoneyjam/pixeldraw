  shared_types:
    input_event:                  # crates/app/src/input/event.rs — W4/W5/W6/W11/W13/W8 공통. W0 이후 변경 금지(필요 시 W0 재오픈)
      source_js: "tools/pointer_event.js buildToolEvent 반환 객체; tools/tool_base.js 시그니처"
      rust: |
        #[derive(Clone, Copy, Debug, PartialEq, Eq)] pub enum Button { Left, Middle, Right, Other }   // JS button 0/1/2/그 외
        #[derive(Clone, Copy, Debug, PartialEq, Eq)] pub enum PointerKind { Mouse, Pen, Touch }
        #[derive(Clone, Debug, PartialEq)]
        pub struct ToolEvent {
            pub x: i32, pub y: i32,            // pixelAt = floor(screenToCanvas); i64→i32 포화 변환
            pub fx: f64, pub fy: f64,          // 실수 캔버스 좌표(도형 핸들 히트 테스트가 사용)
            pub sx: f64, pub sy: f64,          // 호스트 상대 논리 px
            pub button: Button,
            pub shift: bool, pub ctrl: bool,   // ctrl = ctrlKey || metaKey
            pub alt: bool,
            pub pointer_id: u64, pub pointer_kind: PointerKind,
            pub coalesced: Vec<(i32, i32)>,    // 불변: 비어 있지 않음, 연속 중복 없음, 마지막 == (x, y)
            pub time_ms: f64,
        }
        #[derive(Clone, Copy, Debug, PartialEq)] pub struct HoverEvent { pub x: i32, pub y: i32, pub fx: f64, pub fy: f64 }
        #[derive(Clone, Debug, PartialEq)]
        pub struct KeyEvent { pub key: String /* DOM KeyboardEvent.key: "Enter" "Escape" "Delete" "Backspace" "ArrowLeft".. 한 글자는 원문 */, pub code: String /* "Space" 등 */, pub shift: bool, pub ctrl: bool, pub alt: bool }
    tool_api:                     # crates/app/src/tools/api.rs
      source_js: "tools/tool_base.js (Tool), tools/tool_manager.js"
      rust: |
        pub struct ToolCx<'a> {
            pub session: &'a mut pixel_engine::model::Session,
            pub view: pixel_engine::view::View,        // Copy 스냅샷. 도구는 뷰를 바꾸지 않음(팬/줌은 InputController 책임)
            pub need_render: &'a mut bool,             // JS requestRender()
        }
        impl ToolCx<'_> {
            pub fn request_render(&mut self) { *self.need_render = true; }
            /// 입력 경로 에러 정책(JS runAction): notify('error', message, code). 삼키지 않는다.
            pub fn report(&mut self, e: pixel_engine::errors::DrawToolError) { self.session.notify("error", e.message.clone(), e.code); }
            pub fn zoom(&self) -> f64 { self.view.zoom() }   // View::zoom() 접근자 존재(view/types.rs)
        }
        #[derive(Clone, Copy, Debug, PartialEq, Eq)]
        pub enum CursorKind { Default, Crosshair, Cell, Copy, Grab, Grabbing, Text }   // D12 매핑. JS data-URI 커서의 폴백 이름이 그대로 변종
        pub trait Tool {
            fn id(&self) -> &'static str;                                   // settings::TOOL_IDS 와 일치("pen","eraser","eyedropper","fill","line","rect","rrect","ellipse","polygon","arc","chord","radial_gradient","text","hand")
            fn cursor(&self) -> CursorKind { CursorKind::Default }
            fn activate(&mut self, _cx: &mut ToolCx) {}
            fn deactivate(&mut self, _cx: &mut ToolCx) {}                   // ShapeTool 은 여기서 commit() → cx 필요
            fn pointer_down(&mut self, _ev: &ToolEvent, _cx: &mut ToolCx) {}
            fn pointer_move(&mut self, _ev: &ToolEvent, _cx: &mut ToolCx) {}
            fn pointer_up(&mut self, _ev: &ToolEvent, _cx: &mut ToolCx) {}
            fn cancel(&mut self, _cx: &mut ToolCx) {}
            fn hover(&mut self, _ev: Option<&HoverEvent>, _cx: &mut ToolCx) {}
            fn key_down(&mut self, _ev: &KeyEvent, _cx: &mut ToolCx) -> bool { false }
            fn accepts_button(&self, b: Button) -> bool { b == Button::Left } // JS: acceptsButton 없으면 button===0
            fn has_pending(&self) -> bool { false }
            fn discard_pending(&mut self, _cx: &mut ToolCx) {}
            /// 모든 등록 도구에 전달(활성 여부 무관). 반드시 큐 drain 시점에 호출됨(index.yaml translation_conventions.events)
            fn on_model_event(&mut self, _ev: &pixel_engine::model::ModelEvent, _cx: &mut ToolCx) {}
            fn overlay(&self, _info: &OverlayInfo, _out: &mut Vec<OverlayOp>) {}
        }
      notes:
        - "JS Tool.hover(ev) 의 ev 는 {x,y,fx,fy}|null. Rust Option<&HoverEvent>"
        - "ToolManager(W5)는 dyn Tool 을 Vec<Box<dyn Tool>> + id→index 로 보관"
    overlay:                      # crates/app/src/tools/overlay.rs
      why_changed: "이전 로드맵의 OverlayOp 5종은 shape/arc/gradient 미리보기(마스크 비트맵)와 펜 브러시 칸 채움을 표현 못 함"
      rust: |
        use std::sync::Arc;
        pub struct OverlayInfo { pub view: pixel_engine::view::View, pub dpr: f64 }   // 출력 좌표계 = 장치 픽셀(프레임버퍼)
        pub enum OverlayOp {
            /// 캔버스 좌표계 비트맵. data[i]=packed RGBA(u32, 0=건너뜀). 최근접 확대: 픽셀 1칸 = zoom*dpr 장치 px
            MaskBlit { x: i32, y: i32, w: u32, h: u32, data: Arc<[u32]> },
            /// 장치 좌표. 채움(source-over)
            FillRect { x: f64, y: f64, w: f64, h: f64, rgba: [u8; 4] },
            /// 장치 좌표. 선 중심 기준 1px 선(canvas strokeRect 의미: 중심선, 정수 좌표면 반픽셀 걸침). dash=(on,off) 장치 px
            StrokeRect { x: f64, y: f64, w: f64, h: f64, rgba: [u8; 4], dash: Option<(f64, f64)>, difference: bool },
            Line { x0: f64, y0: f64, x1: f64, y1: f64, rgba: [u8; 4], width: f64, difference: bool },
            Circle { cx: f64, cy: f64, r: f64, rgba: [u8; 4], width: f64, dash: Option<(f64, f64)> },   // 그라디언트 반경 원
        }
        /// 마스크(0/1) + 색 → MaskBlit. 설정된 셀의 bbox 로 잘라낸다(arc/chord 마스크는 캔버스 전체 크기라 그대로 보내면 프레임마다 2.2M 칸).
        pub fn mask_to_blit(mask: &pixel_engine::raster::Mask, packed: u32, alpha_scale: Option<f64>) -> Option<OverlayOp>;
        /// 이미 packed 픽셀 마스크(GradientMask.data) → MaskBlit (알파 0.82 적용은 alpha_scale)
        pub fn packed_to_blit(w: usize, h: usize, data: &[u32], alpha_scale: Option<f64>) -> Option<OverlayOp>;
      alpha_rule: "pixel_preview.js: hex 색은 a = Math.round(rgba.a * 0.82); packed 는 Math.round(a*0.82). 도형 미리보기(shape_overlay.js blitLayer)는 0.82 없이 원래 알파"
      mask_struct: "raster::Mask{x:i32,y:i32,w,h, data:Vec<u8>} (mask.rs:16) — 필드·접근자를 읽고 시작. is_set(x,y)"
  tests: ["공유 타입 단위 테스트(Default/비교/헬퍼)", "constants 핀", "cargo test --workspace >= 321 유지", "cargo run -p pixeldraw 정상 종료"]
  accept: ["clippy/fmt 그린", "app: lib+bin 빌드, egui 의존 없음", "모든 stub 모듈이 컴파일"]
  log_draft_hint: "constants 추가 수, 공유 타입 3종 시그니처 해시(후속 작업이 변경 못하게 오케스트레이터가 diff 감시)"

# ─────────────────────────────────────────────────────────────────────────────
- id: W1
  title: StrokeSession — Session 이 편집(스트로크)을 소유 (도구 블로커)
  wave: 1
  difficulty: hard
  problem: |
    JS PenTool 은 pointerDown 에서 `edit = session.beginEdit()` 를 만들어 여러 이벤트에 걸쳐 필드로 들고 있다(pen.js:`this._edit`).
    Rust `Session::begin_edit(&mut self) -> EditHandle<'_>` 는 Session 을 &mut 로 빌린 채 산다(session/core.rs:269, edit_session.rs:49).
    도구가 핸들을 필드로 가질 수 없다(자기참조/이중 가변 빌림). → Session 이 스트로크 상태를 소유하는 API 를 추가한다.
  verified_facts:
    - "PixelWriter<'a>{store:&'a mut ChunkStore, layer_id:String(pub), before:BTreeMap<u64,Option<Box<Chunk>>>, dirty:BTreeSet<u64>, last_key:Option<u64>, done:bool} (chunkstore/writer.rs:30-41). Drop impl 없음"
    - "PixelWriter 는 이미 raster::PixelSink 를 구현함(raster/brush.rs:108-124: 음수 좌표는 무시, i32→u32 캐스트). 어댑터 불필요"
    - "EditHandle::commit(label): take_dirty → finish() → editing=false → pixels_changed 이벤트(dirty 비어있지 않으면) → cs None 이면 Ok(false) → history.record(PaintCommand::new(cs, label)) → dispatch_effects (edit_session.rs:118-143)"
    - "EditHandle::cancel(): writer.discard() → editing=false → pixels_changed(dirty) (edit_session.rs:146-158)"
    - "EditHandle::flush(): writer.take_dirty(); 비어있지 않으면 bus.emit(pixels_changed(layer_id, dirty)) (edit_session.rs:100-112)"
    - "begin_edit 가드 순서: doc 없음→INVALID_STATE 'no document loaded'; core.editing → 'already editing'; layer 해석; locked→status warn '레이어가 잠겨 있습니다' + Err(layer_locked); !visible → warn '레이어가 숨겨져 있습니다' + Err(layer_hidden); editing=true (session/core.rs:269-303). label 기본 '연필'"
    - "Session::undo/redo: step() 이 core.editing 이면 Ok(None)(session/core.rs:244) → undo 는 스트로크 중 Ok(false)"
    - "Session::install(doc): editing=false 로 리셋(session/core.rs:178-190) — 스트로크가 남아있으면 같이 폐기해야 함"
    - "SessionCore{history, editing, bus, settings}; dispatch_effects 는 core 메서드(pub(crate))"
    - "Rust 테스트 하나가 '핸들을 commit/cancel 없이 drop 하면 is_editing 이 영구 true' 패리티를 고정함 — 건드리면 안 됨"
  write_scope: {see: "write_scopes.W1"}
  design:
    state: |
      // chunkstore/writer.rs
      pub struct StrokeState { pub(crate) layer_id: String, pub(crate) before: BTreeMap<u64, Option<Box<Chunk>>>, pub(crate) dirty: BTreeSet<u64>, pub(crate) last_key: Option<u64> }
      impl<'a> PixelWriter<'a> {
          pub fn resume(store: &'a mut ChunkStore, state: StrokeState) -> Self;   // done=false
          pub fn suspend(self) -> StrokeState;                                     // last_key 까지 보존(성능 R1)
      }
      // PixelWriter::new/finish/discard/set/get/take_dirty/touched 는 동작·시그니처 불변. 내부 필드를 StrokeState 로 묶는 리팩터는 허용하되 기존 chunkstore 테스트 전부 통과
      // SessionCore 에 추가: pub(crate) stroke: Option<ActiveStroke>   // ActiveStroke{ state: StrokeState, label: String }
    api: |
      impl Session {
          /// begin_edit 와 같은 가드·같은 status 이벤트·같은 에러 코드. 성공 시 core.editing=true, core.stroke=Some(..)
          pub fn stroke_begin(&mut self, opts: EditOptions) -> EngineResult<()>;
          /// 스트로크 레이어의 store 를 재차용해 PixelWriter 를 만들어 f 에 넘기고, 끝나면 suspend 해 되돌려 놓는다.
          /// 스트로크 없음→INVALID_STATE "edit is not active". 레이어가 사라졌으면 INVALID_STATE + 스트로크 폐기(editing=false, 이벤트 없음)
          pub fn stroke_with<R>(&mut self, f: impl FnOnce(&mut PixelWriter<'_>) -> R) -> EngineResult<R>;
          pub fn stroke_flush(&mut self) -> Vec<(u32, u32)>;                       // EditHandle::flush 동치
          pub fn stroke_commit(&mut self, label: Option<&str>) -> EngineResult<bool>; // EditHandle::commit 동치. 스트로크 없음 → Err("edit is not active")
          pub fn stroke_cancel(&mut self);                                          // EditHandle::cancel 동치. 스트로크 없음 → no-op
          pub fn has_stroke(&self) -> bool;
          pub fn stroke_layer_id(&self) -> Option<&str>;
      }
    rules:
      - "begin_edit 와 stroke_begin 은 같은 core.editing 플래그를 공유 → 동시에 쓰면 'already editing'"
      - "install()(new_document/load_document)은 core.stroke 를 이벤트 없이 버린다(문서가 통째로 바뀌므로 복원 불필요) — editing=false 리셋과 한 쌍"
      - "undo/redo 는 기존 가드 그대로 Ok(false)"
      - "stroke_with 의 반환값 R 로 도구가 apply_shape 의 EngineResult 를 받을 수 있게 함. f 안에서 panic 하면 스트로크 상태가 날아감 → debug 에서만 문제(panic=abort 는 release)"
      - "PixelWriter 를 만들 때 doc.get_layer_mut(layer_id).store 와 core(history 등)를 동시에 빌릴 일 없음: stroke_with 는 doc 만 빌린다(core.stroke 는 먼저 take 해서 지역 변수로)"
  tests:
    - "stroke_begin→stroke_with(stroke_point)→stroke_flush→stroke_commit 이 begin_edit 경로와 바이트 동일한 changeset·히스토리 엔트리를 만든다(두 Session 에 같은 입력, undo 후 store 바이트 비교, undo_label 동일)"
    - "여러 stroke_with 호출에 걸친 before-image 유지: 청크 A,B 를 두 호출로 건드리고 cancel → 둘 다 원복, 신규 청크는 store 에서 제거(chunk_count 복원)"
    - "stroke_flush 가 PixelsChunks 이벤트를 내고 같은 청크를 다시 쓰면 다시 dirty 에 들어간다(last_key 메모 리셋 트랩: writer.rs:101-105)"
    - "잠긴/숨긴 레이어에서 stroke_begin: 같은 에러 코드(LAYER_LOCKED/LAYER_HIDDEN)와 같은 status 이벤트(level warn, 문자열 동일), is_editing=false"
    - "스트로크 중 undo()==Ok(false), begin_edit/stroke_begin 은 'already editing'"
    - "스트로크 중 레이어 삭제 후 stroke_with → INVALID_STATE, is_editing=false 복구"
    - "스트로크 중 new_document → has_stroke=false, is_editing=false, 이벤트 순서 document_replaced→history_changed"
    - "빈 스트로크(아무것도 안 씀) commit → Ok(false), 히스토리 엔트리 없음, editing=false"
    - "기존 테스트 321건 전부 통과(특히 abandoned-handle 패리티)"
    - "성능: examples/bench.rs 의 stroke pen=64 항목을 begin_edit 경로 vs stroke_with 경로로 비교해 회귀 ≤ 5% 임을 로그에(R1: last_key 보존). 신규 bench 항목 추가는 허용(bench.rs 는 W1 write_scope 밖이므로 examples/bench_stroke.rs 로 별도 파일)"
  accept: ["위 테스트 + 게이트", "docs/model_internals.md §8 'StrokeSession' (설계 근거 + 위 rules)"]
  extra_write_scope: [crates/engine/examples/bench_stroke.rs]

# ─────────────────────────────────────────────────────────────────────────────
- id: W2
  title: display — 배경·그리드·테두리·블릿을 CPU 프레임버퍼로 (2.5)
  wave: 1
  difficulty: medium
  read_first: [src/render/background.js, src/render/grid.js, src/render/renderer_display.js, "docs/render.md §7-§10", crates/engine/src/view/geom.rs, crates/engine/src/view/types.rs]
  invariants:
    framebuffer_opaque: "프레임버퍼는 CANVAS_HOST_BG 로 초기화한 불투명 RGBA(a=255 항상). JS 는 transparent 캔버스 위에 그리고 호스트 CSS 배경(#3c3f45)이 비쳤음 → 동치. 이로써 모든 합성식을 '불투명 dst'로 단순화"
    no_dom: "엔진 순수: egui/winit/GPU import 0"
  api: |
    // display.rs 는 mod + pub use 만
    pub struct Framebuffer { pub width: u32, pub height: u32, pub rgba: Vec<u8> }
    impl Framebuffer {
        pub fn new(w: u32, h: u32) -> Self;                       // CANVAS_HOST_BG 로 채움
        pub fn resize_clear(&mut self, w: u32, h: u32);           // 크기 같으면 재사용, 내용은 CANVAS_HOST_BG 로 리셋
        pub fn fill_rect(&mut self, x: i32, y: i32, w: i32, h: i32, rgb: [u8; 3]);                       // 불투명 덮어쓰기, 프레임버퍼 경계로 클립
        pub fn blend_rect(&mut self, x: i32, y: i32, w: i32, h: i32, rgb: [u8; 3], alpha: f64, clip: Option<IRect>);   // source-over
        pub fn difference_rect(&mut self, x: i32, y: i32, w: i32, h: i32, alpha: f64, clip: Option<IRect>);           // 흰 src, difference
        pub fn draw_line(&mut self, /* W8 overlay_raster 가 쓰는 pub 프리미티브 — 서명은 W2 가 정하고 로그 초안에 적는다 */);
    }
    #[derive(Clone, Copy)] pub struct IRect { pub x0: i32, pub y0: i32, pub x1: i32, pub y1: i32 }   // 반개구간
    #[derive(Clone, Copy, PartialEq, Eq)] pub enum GridMode { Off, Unit, Tile, Pixel }               // constants::GRID_MODES 와 1:1, GridMode::parse(&str)
    pub struct GridStroke { pub g: u32, pub a: f64 }           // JS {g,a}: a 가 팔레트 마커(0.15/0.3/0.55)
    pub struct GridLines { pub xs: Vec<GridStroke>, pub ys: Vec<GridStroke> }
    pub fn grid_lines(view: &View, w: u32, h: u32, vw: f64, vh: f64, mode: GridMode) -> Option<GridLines>;
    pub fn grid_stroke_dev_px(a: f64, dpr: f64) -> u32;
    pub struct DisplayParams<'a> { pub view: View, pub canvas_w: u32, pub canvas_h: u32, pub css_w: f64, pub css_h: f64, pub dpr: f64,
                                   pub background: &'a str, pub grid: GridMode, pub comp: Option<&'a [u8]> /* canvas_w*canvas_h*4 */ }
    pub fn draw_display_into(p: &DisplayParams, fb: &mut Framebuffer);   // fb 크기 = max(1, round(css*dpr)) 로 맞춘 뒤 그림(호출자가 resize_clear)
    pub fn draw_display(p: &DisplayParams) -> Framebuffer;
    pub fn blit_visible(/* JS blitVisible */);
  js_algorithm:                   # 코드 읽어 확인한 정확한 순서·수식(verified)
    draw_display:
      - "devW = max(1, round(cssW*dpr)); devH 동일 (JS Math.round)"
      - "dx = round(offsetX*dpr); dy = round(offsetY*dpr); dw = round(w*zoom*dpr); dh = round(h*zoom*dpr) — 각각 개별 반올림(우하단을 dx+dw 로 유도 금지)"
      - "1) 클립 rect(dx,dy,dw,dh) 안에서 paintBackground → blitVisible  2) 클립 해제 후 paintGrid(자체 클립 rect)  3) dw>0&&dh>0 이면 테두리 4변 4) 오버레이(W8)"
    paint_background:
      - "bg = (background==='transparent' || !문자열) ? None : parseHex(background). None 또는 bg.a===0 → paintChecker 만"
      - "bg.a !== 255 → 체커 먼저, 그 위에 fillStyle `rgba(r,g,b,${(a/255).toFixed(3)})` — 알파가 소수 3자리로 양자화됨(트랩): alpha = parse(format!('{:.3}', a/255.0)) (JS toFixed(3) 는 반올림 half-up-ish; Rust format!('{:.3}') 는 half-to-even 아님(IEEE 정확값 기준) — 경계값 a=128 → 0.50196→'0.502' 로 둘 다 동일. 경계 케이스는 테스트로 고정)"
      - "bg.a === 255 → 단색 fillRect(dx,dy,dw,dh) (체커 생략; 결과 동일)"
    paint_checker:
      - "cell = max(1, round(8*dpr)). 뷰포트 교집합 [vx0,vx1)×[vy0,vy1) = (dx..dx+dw)∩(0..devW) 만 칠함(비용을 뷰포트에 비례시키는 최적화이며 위상은 장치 원점 기준이라 전체 루프와 픽셀 동일 — 브루트포스 대조 테스트 필수)"
      - "전체를 A(#fff)로 채우고, x0=floor(vx0/cell)*cell, y0=floor(vy0/cell)*cell, iy=round(y0/cell), ix=round(x0/cell) 부터 cell 간격으로 순회, ((ix+iy)%2+2)%2 !== 0 이면 B(#d9d9d9) 셀 fillRect(x,y,cell,cell) (뷰포트 밖으로 넘치는 셀은 캔버스 클립에 의해 잘림 — Rust 는 교집합으로 클립)"
    blit_visible:
      - "x0=max(0,floor((0-offsetX)/zoom)); y0 동일. sw=min(w, ceil((cssW-offsetX)/zoom)) - x0; sh 동일. sw<=0||sh<=0 → 종료"
      - "ddw=round(sw*zoom*dpr); ddh 동일. <=0 → 종료. 목적 시작 = (round((offsetX+x0*zoom)*dpr), round((offsetY+y0*zoom)*dpr))"
      - "drawImage(comp, x0,y0,sw,sh → dest, ddw,ddh) imageSmoothingEnabled=false(최근접) + 클립(dx,dy,dw,dh). source-over(comp 은 straight alpha RGBA)"
      - "Rust 정의(계약): 목적 픽셀 (px,py) ← 소스 (x0 + floor((px-dest_x)*sw/ddw), y0 + floor((py-dest_y)*sh/ddh)). 정수 줌·정수 dpr 에서 브라우저와 정확히 일치. 비정수 배율은 이 정의가 계약(브라우저 구현 의존이라 비트 일치를 요구하지 않음)"
    grid_lines:                   # 순수 함수 — JS 와 숫자 동일해야 함
      - "z=view.zoom. showUnit=(mode∈{unit,pixel}) && CHUNK_PX*z>=6; showTile=(mode∈{tile,pixel}) && TILE_PX*z>=6; showPixel= mode==pixel && z>=8; 셋 다 false → None"
      - "xA=(0-offsetX)/z, xB=(vw-offsetX)/z, yA,yB 동일. pushLines(arr, lo, hi, max, step, alpha): k0=max(0,ceil(max(0,lo)/step)); k1=min(max/step, floor(min(max,hi)/step)); k0..=k1 에 {g:k*step, a:alpha}"
      - "순서: pixel(step1, a=0.15) → unit(step32, a=0.3) → tile(step64, a=0.55). xs,ys 각각. pixel 이 인덱스 0부터. (테스트 단언: 순서 포함)"
      - "주의: max/step 이 정수가 아닐 수 있음(w/step) — w 는 32 배수라 unit/pixel 은 정수, tile(64) 은 w=96 같은 경우 소수 → k1=min(1.5, ..) 후 `for k<=k1` 이므로 k=0,1 — Rust 는 k1 을 f64 로 두고 비교"
    paint_grid:
      - "sx=max(1, dpr||1). y0=max(dy,0), y1=min(dy+dh,devH), gx0=max(dx,0), gx1=min(dx+dw,devW). y1<=y0||gx1<=gx0 → 종료. 클립 rect(dx,dy,dw,dh)"
      - "xs 전부 먼저: strokeRun(a, x=round((offsetX+g*zoom)*sx), y=y0, len=y1-y0, horizontal=false). 그다음 ys: strokeRun(a, x=gx0, y=round((offsetY+g*zoom)*sx), len=gx1-gx0, horizontal=true)"
      - "strokeDevPx(a,dpr): a==0.15 → 1; 아니면 css = (a==0.55 ? 2 : 1); max(1, ceil(css*dpr))  (ceil, round 아님 — 주석에 이유: dpr 1.25 에서 1css 선이 0.8 로 사라지는 것 방지)"
      - "passAlpha(a,dark): a==0.55 → dark?0.5:0.44; 그 외 → dark?0.32:0.3"
      - "strokeRun(a,x,y,len,horizontal,dpr): px=strokeDevPx, hair=(a==0.15), main=hair?1:px; cw = horizontal ? (hair ? len : main) : main; ch = horizontal ? main : (hair ? len : main)  ← D5: non-hair 의 light fillRect 는 main×main 정사각형(런 전체 아님). 리터럴 복제"
      - "hair: globalCompositeOperation='difference', fillStyle rgba(255,255,255,a), fillRect(x,y,cw,ch) 로 끝. non-hair: source-over, light = rgba(255,255,255,passAlpha(a,false)) fillRect(x,y,cw,ch); dark = rgba(0,0,0,passAlpha(a,true)): bx = horizontal ? x : x+px-1; by = horizontal ? y+px-1 : y; fillRect(bx,by, horizontal?len:1, horizontal?1:len)"
    border: "fillStyle rgba(0,0,0,0.6): fillRect(dx-1,dy-1,dw+2,1), (dx-1,dy+dh,dw+2,1), (dx-1,dy,1,dh), (dx+dw,dy,1,dh). 클립 밖(클립은 restore 됨). 프레임버퍼 경계로만 잘림"
  compositing_formulas:           # 불투명 dst 가정. rnd = floor(v+0.5) (blend::rnd 재사용)
    source_over: "out_c = rnd(dst_c*(1-a) + src_c*a), out_a=255. a=0 → no-op"
    difference_white: "out_c = rnd(dst_c*(1-a) + a*(255-dst_c))  (src=255, difference = |dst-src| = 255-dst)"
    caveat: "브라우저 캔버스는 프리멀티플라이드 8비트 내부 표현이라 ±1 차이가 날 수 있다. 계약은 위 식 고정이며 브라우저 비트 일치가 게이트가 아님 → docs/render.md 에 명시"
  oracle:
