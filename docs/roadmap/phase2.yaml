      pub struct ToolManager { tools: Vec<Box<dyn Tool>>, active: String }
      impl ToolManager {
          pub fn new(initial_active: &str) -> Self;
          pub fn register(&mut self, tool: Box<dyn Tool>);                 // 등록 시 id==active 이면 activate 는 W8 가 cx 를 줄 때 호출(register 는 cx 없음) → activate_initial(cx)
