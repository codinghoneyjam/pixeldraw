    - {name: SHAPE_HANDLE_DEV_PX, value: 8, js: "shape_overlay.js drawFrame hs = 8*dpr"}
    - {name: SHAPE_DASH, value: "[4,3] (×dpr)", js: "shape_overlay.js setLineDash([4*dpr,3*dpr])"}
