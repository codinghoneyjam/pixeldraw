  tests:
    - "JS 포팅: rg -l 'PenTool|FillTool' tests 의 케이스(tools_basic.test.mjs 등)를 엔진 Session 위에서 재현"
    - "(a) 펜 down/move/up → undo 1회 원복, 라벨 '연필' (b) shift 직선(last_point 필요) (c) 지우개(투명 0 쓰기→빈 청크 제거) (d) 잠긴 레이어: 스트로크 무시 + Status warn 이벤트 + 이후 move/up 무시 (e) 채우기 동일색 알림+히스토리 변화 없음 (f) alt 스포이트(펜) 투명/불투명 (g) 스포이트 좌/우/Shift/Alt 4×, 드래그 중 버튼 래치 (h) 도구 전환 중 진행 스트로크 취소 (i) DocumentReplaced 후 shift 직선이 last_point 없음으로 동작 (j) 스트로크 중 size 변경 무시 (k) coalesced 다점 이동 시 Bresenham 연속성 (l) 채우기 캔버스 밖 클릭 무시 (m) switch_to 가 cancel→deactivate→activate 순서"
    - "ToolManager: 미등록 활성 도구 에러, 모든 도구에 이벤트 전달(비활성 pen 도 DocumentReplaced 로 last_point 초기화)"
  accept: ["위 테스트 + 게이트", "rg 'egui|winit|eframe' crates/app/src/tools 비어 있음"]

# ─────────────────────────────────────────────────────────────────────────────
- id: W6
  title: tools-shape — line/rect/rrect/ellipse/polygon + 오버레이 (2.7b)
  wave: 2
  difficulty: hard
  needs: [W0, W1]
  read_first: [src/features/shape/shape.js, shape_geom.js, shape_render.js, shape_overlay.js, shape_pending.js, shape_keys.js, "rg -l 'ShapeTool|shape_geom|shape_pending' tests", crates/engine/src/raster/shape_raster.rs, crates/engine/src/raster/snap.rs, crates/engine/src/raster/mask.rs]
  rust_apis_verified:
    - "raster::shape_raster::{ShapeKind{Line,Rect,Rrect,Ellipse,Polygon}, FillMode{Outline,Fill,Both}, ShapeSpec{kind,stroke_width:i32,fill_mode,bbox:Option<[i32;4]>,p0,p1:Option<(i32,i32)>,radius:i32,points:Vec<[i32;2]>}(Debug+Clone, PartialEq 없음), apply_shape<S:PixelSink>(sink,&spec,primary:u32,secondary:u32)->EngineResult<usize>}"
    - "raster::snap::{angle_snap(x0,y0,x1,y1,step_deg)->[f64;2], angle_snap_deg(..)(15°), drag_bbox((i64,i64),(i64,i64),lock,center)->[i64;4], resize_bbox(b:[i64;4], handle:&str, p:(i64,i64), lock, center, min_size:i64)->[i64;4], unit_snap([i64;4])->[i64;4]}"
    - "blend::rnd 는 floor(v+0.5)(JS rnd). 32px 스냅: rnd(p/32)*32"
    - "Layers 이벤트 reason: Add|Remove|Move|Prop|Active (Replace 없음 — JS 의 'replace' 분기는 DocumentReplaced 로 이미 커버)"
  js_state_machine: |
    mode ∈ {idle, drawing, pending, resizing, moving, placing}. 필드: pending, draw, op, place, hover_pt, emitted, masks cache.
    KINDS/LABELS: line 직선, rect 사각형, rrect 둥근 사각형, ellipse 타원, polygon 다각형. 도구 id = kind. cursor Crosshair. 라이브 설정 키: penSize shapeFill shapeRadius snapUnit shapeLockAspect (색은 라이브가 아님 — pending.color 가 그리는 시점 색을 소유)
    flags(ev) = {shift, lock: shift || settings.shapeLockAspect, center: alt, snap: settings.snapUnit}
  pointer_down: |
    button != Left → return. doc 없음 또는 mode ∉ {idle,pending,placing} → return.
    p=(ev.x,ev.y).
    mode==placing && place → placePoint
    mode==pending && pending:
       h=hitHandle(kind, pending, ev.fx, ev.fy, 6/zoom) → resize 시작: op={type:resize, handle:h.id, end:h.end, orig:clone(pending)}; mode=resizing; resizeTo(ev); return
       grab=max(penSize/2, 4/zoom); insideShape(kind, pending, fx, fy, grab) → op={type:move, ox:p.x, oy:p.y, orig}; mode=moving; return
       else commit()  (그리고 아래로 계속 — 새 도형 시작)
    kind==polygon → place={points:[snapPlacePoint(p, snapUnit)], layerId:doc.activeLayerId}; hover_pt=None; mode=placing; emitChanged; render; return
    else draw={p0:p, layerId:doc.activeLayerId, shift, alt}; mode=drawing; render
  pointer_move: "drawing: draw.cur=(x,y), shift/alt 갱신, render. placing: hover_pt=(x,y), render. resizing: resizeTo(ev). moving: pending=moveGeom(kind, op.orig, ev.x-op.ox, ev.y-op.oy, snapUnit); emitChanged; render"
  pointer_up: |
    drawing: p0=draw.p0, p=(ev.x,ev.y); idle = pending?'pending':'idle'
       p==p0 → draw=None; mode=idle(또는 pending)   (제자리 클릭은 도형 없음 — 펜과 달리 점을 안 찍음)
       else g=dragGeom(kind,p0,p,flags(ev),settings.shapeRadius); pending={layerId:draw.layerId, color:settings.primaryColor, ..g}; mode=pending
       emitChanged; render
    resizing|moving: op=None; mode=pending; emitChanged; render
  geometry:
    drag_geom: "line: p = flags.shift ? angle_snap_deg(p0,p1) : p1 → {bbox:None, p0, p1:p, radius:0}. 그 외: b=drag_bbox(p0,p1,flags.lock,flags.center); snap 이면 unit_snap(b) → {bbox:b, radius:settings.shapeRadius}"
    resize_geom: "line: fixed = end==0 ? orig.p1 : orig.p0; np = shiftSnap ? angle_snap(fixed,p) : p. polygon: idx=handle id 'v{i}' 파싱(범위 밖이면 orig 반환); snap 이면 rnd(p/32)*32. 그 외: resize_bbox(orig.bbox, handleId, p, flags.lock, flags.center, 1); snap 이면 unit_snap"
    move_geom: "snap 이면 각 점/ bbox 원점을 rnd((v+d)/32)*32, 아니면 +d. line/polygon 은 모든 점"
    handles: "bbox: x1=x+w-1, y1=y+h-1, xm=(x+x1)/2, ym=(y+y1)/2 (f64) 에서 nw,n,ne,e,se,s,sw,w 순(HANDLE_IDS). line: p0(end 0), p1(end 1). polygon: v0..vn"
    hit_handle: "|fx-h.x|<=tol && |fy-h.y|<=tol 첫 일치(순서 = 레이아웃 순서)"
    inside_shape: "line: distSeg<=grab. polygon: even-odd pointInPolygon 이거나 어떤 변과의 거리<=grab. bbox: fx∈[x, x+w-1] && fy∈[y, y+h-1]"
    point_in_polygon: "for i,j=n-1: (yi>fy)!=(yj>fy) && fx < (xj-xi)*(fy-yi)/(yj-yi)+xi → inside 토글"
    parse_option_values: "setPending(v) — 정수 가드 asInt(OUT_OF_RANGE `invalid ${what}`). bbox: w,h>=1 아니면 OUT_OF_RANGE 'shape w,h must be >= 1'; radius 정수·>=0 'radius must be >= 0'. line: {x0,y0,x1,y1} 또는 {x,y,w,h}(p1=x+w-1,y+h-1; w,h>=1 'line extents must be >= 1'). polygon: points>=3 'polygon needs >= 3 points'. 편집 시 기존 pending.color 유지(색 변경 후 숫자 수정이 재색칠하지 못하게)"
  placing: |
    place_point: pts=place.points; first=pts[0]; tol=6/zoom; (ev.fx,fy). pts.len()>=3 && |fx-first.x|<=tol && |fy-first.y|<=tol → finishPlacing; else pts.push(snapPlacePoint(p, snapUnit)); emitChanged; render
    finish_placing: place.points.len()<3 → false. pending={layerId:place.layerId, color:settings.primaryColor, bbox:None,p0:None,p1:None, points}; place=None; hover_pt=None; mode=pending; emitChanged; render; true
  keys: |
    Enter: mode==placing → finishPlacing. drawing||!hasPending → false(소비 안 함). else op=None; mode=pending; commit(); true
    Escape|Delete|Backspace:
       placing&&place: Escape && points>1 → 마지막 점 pop(한 점 되돌리기); emitChanged; render; true.  그 외 → place=None; hover_pt=None; mode = pending?pending:idle; emitChanged; render; true
       (drawing|resizing|moving) && Escape → cancel(); true
       hasPending||draw||op → discardPending(); true
       else false
    Arrow*: step = shift?32:1. d. !d || !hasPending || mode!=pending → false. pending 의 모든 점/bbox/p0,p1 을 d 만큼 이동(bbox 는 x,y 만). emitChanged; render; true
  commit: |
    pending 없음 → false. layerId=pending.layerId; label=LABELS[kind]
    session.stroke_begin(on_layer(layerId).labeled(label)): Err 코드 ∈ {LAYER_LOCKED, LAYER_HIDDEN, LAYER_NOT_FOUND} → discardPending(); return false. 다른 Err → 전파(report)
    color=pending.color (스냅샷), packed=pack(parse_hex(color)) — 실패 시 OUT_OF_RANGE `invalid color`
    stroke_with(|w| apply_shape(w, &spec, packed, packed))  ← primary 와 secondary 에 같은 색(보조색은 버퍼일 뿐 칠하지 않음 — JS 주석)
    stroke_commit(Some(label)); pending=None; op=None; mode=idle; emitChanged; render; true
    spec(kind,pending,settings): line → {kind:Line,p0,p1,stroke_width:penSize}. polygon → {kind:Polygon, points, stroke_width:penSize, fill_mode: settings.shapeFill}. 그 외 → {kind, bbox, radius: kind==Rrect? pending.radius : 0, stroke_width:penSize, fill_mode: settings.shapeFill}
    fill_mode: FillMode::parse(Some(settings.shape_fill)) — settings 는 "outline"|"fill" 만(Both 는 도달 불가)
  events:
    on_model_event: |
      Settings{key ∈ LIVE_KEYS}: kind==rrect && pending && key==shapeRadius → pending.radius = value(Int). pending||draw 있으면 emitChanged; render
      Layers{reason:Active}: hasPending → commit()   (JS: 활성 레이어 변경 시 보류 도형을 먼저 확정. pending.layerId 를 캡처해 두었으므로 새 활성 레이어가 아니라 원래 레이어에 그려짐)
      Layers{reason:Remove}: hasPending && pending.layerId 레이어가 doc 에 없음 → discardPending()
      DocumentReplaced: discardPending()
    deactivate: "placing 이면 points>=3 이면 finishPlacing, 아니면 place=None/hover=None/mode=pending?pending:idle. 그다음 hasPending → commit(). draw/op/place/hover=None; mode=idle  (도구를 떠나도 완성된 작업은 유지)"
    activate: render
    cancel: "placing: place/hover 제거, mode=pending?pending:idle, emitChanged, render. drawing: draw=None; mode 복귀. resizing|moving: pending=op.orig; op=None; mode=pending. 모두 emitChanged+render"
    discard_pending: "pending/draw/op/place/hover=None; mode=idle; emitChanged; render"
  emit_changed: |
    cur = JSON.stringify({pending: getPending(), vertices: getVertices()}); cur==emitted 이면 return; emitted=cur; session.emitToolState(kind, pending)
    getPending(): line → {x0,y0,x1,y1}; polygon → {points:[{x,y}]}; bbox → {x,y,w,h,radius}; pending 없음 → null.  getVertices(): polygon 이면 (place?.points ?? pending?.points) 복사, 아니면 null.
    Rust: 변경 감지 키 = serde_json::to_string(&json!({"pending":..., "vertices":...})) (키 순서 pending, vertices). Session::emit_tool_state(kind, pending_string) 의 pending_string = serde_json 직렬화(키 순서 = 위 필드 순서, 없으면 'null')
  preview_and_overlay:
    preview_spec: "drawing → draw 의 cur(없으면 p0)로 dragGeom(flags: shift, lock=shift||shapeLockAspect, center=alt, snap) → spec. placing → placingSpec. else pending → buildSpec"
    placing_spec: "placed=place.points; hov=hover_pt(반올림); hov 있으면 trail=placed+[hov]: trail>=3 → polygon(trail), 아니면 line(placed.last→hov). hov 없고 placed>=3 → polygon(placed). else None"
    paint_layers_rust: "allowed_deviation(미리보기 한정): JS 는 마스크 함수를 따로 호출해 apply_shape 를 손으로 흉내냄(computePaintLayers). Rust 는 apply_shape 를 스크래치 PixelSink(bbox 수집)에 실행해 마스크를 얻는다 — 미리보기와 커밋이 구조적으로 동일(WYSIWYG 보장). 캐시 키 = format!('{:?}', spec) + color (ShapeSpec 에 PartialEq 가 없고 W6 는 engine 수정 불가)"
    overlay_ops: |
      MaskBlit(spec 래스터 결과, 알파 원본 — 0.82 아님; shape_overlay.js blitLayer: 설정된 칸은 css 색의 a 사용)
      + StrokeRect 점선(dash (4*dpr, 3*dpr)) 검정 불투명, 1px: box = line → {min(p0,p1), |Δ|+1}; polygon → polygon_bbox(points); 그 외 spec.bbox. 위치=deviceOf(box.x, box.y)=((offsetX + x*zoom)*dpr, ...), 크기=max(w*zoom*dpr,1)
      + 핸들: layoutHandles(spec.kind, geomFromSpec(spec)) 각 점마다 흰색 FillRect + 검정 StrokeRect, 한 변 hs=8*dpr, 중심 = deviceOf(h.x, h.y) (정수 픽셀의 좌상단 코너 기준 — 픽셀 중심이 아님; 그대로 복제)
      주의: 핸들은 spec.kind 기준(도구 kind 아님): 다각형 배치 중 첫 변 미리보기는 line spec 이므로 line 핸들 2개
  tests:
    - "JS 포팅: rg -l 'ShapeTool|shape_geom|shape_pending|shape_keys' tests"
    - "엔진 Session 위에서 rect/ellipse/line 드래그→commit(Enter)→undo, Escape 취소, 제자리 클릭=도형 없음"
    - "polygon: 3점 + 첫 점 클릭(tol 6/zoom) 닫기, Escape 한 점 되돌리기, Enter 확정, <3점 Enter 무시"
    - "resize 8핸들 × lock/center/snap 조합, move + snap, 핸들 우선 > 내부 이동 > 새 도형(외부 클릭은 먼저 commit)"
    - "활성 레이어 변경 → 원래 레이어에 commit, 레이어 삭제 → discard, 문서 교체 → discard"
    - "잠긴 레이어에 commit → pending 폐기 + false (+ Status 이벤트)"
    - "emit_tool_state 변경 감지: 같은 상태 반복 호출에서 이벤트 1회, 키 순서 {pending,vertices}"
    - "색 스냅샷: 그리기 후 primaryColor 변경해도 pending 색 유지, setPending 도 유지"
    - "프리뷰 == 커밋: 같은 spec 의 preview mask 가 commit 후 레이어 픽셀 집합과 동일"
    - "geometry 수식은 raster_golden.json 의 drag_bbox/angle_snap/unit_snap 그룹이 이미 snap.rs 를 검증하므로 도구 레벨에서는 호출 배선만 확인"
  accept: ["위 테스트 + 게이트", "파일 각 300줄 이하(JS 6파일 → Rust 6~8모듈: shape.rs 파사드 + geom/pending/keys/render/overlay/state)", "egui import 0"]

# ─────────────────────────────────────────────────────────────────────────────
- id: W11
  title: tools-arc-gradient — arc/chord/radial_gradient 도구 (D11)
  wave: 2
  difficulty: medium
  needs: [W0, W1]
  read_first: [src/features/arc/arc_tool.js, src/features/gradient/gradient_tool.js, src/tools/pixel_preview.js, crates/engine/src/raster/arc.rs, crates/engine/src/raster/arc/angle.rs, crates/engine/src/raster/arc/chord.rs, crates/engine/src/raster/gradient.rs]
  rust_apis_verified:
    - "raster::arc::angle::{Box2{cx,cy,rx,ry}, arc_mask(b:Box2,start_deg,end_deg,width:i32,w:usize,h:usize)->EngineResult<Mask>} ; chord::{chord_fill_mask(b,start,end,w,h), chord_outline_mask(b,start,end,width,w,h)} — 모두 캔버스 전체 크기 w×h 마스크(Mask.data 0/1, 행 우선). 공개 경로(arc.rs 재수출 여부)는 읽을 것"
    - "raster::gradient::{Stop::new(t,r,g,b,a), RadialGradient{cx,cy,r0,r1,stops:Vec<Stop>,w,h}, radial_gradient_mask(&g)->EngineResult<GradientMask{w,h,data:Vec<u32>}>}"
  arc_chord_tool:
    ids: "arc, chord (한 구조체 kind)"; cursor: Crosshair
    fields: {start: "f64 기본 0", end: "f64 기본 180", width: "i32 기본 2", chord_mode: "Fill|Outline 기본 Fill", draw: Option<Draw>}
    note_options: "이 4개는 설정(Settings)이 아니라 도구 로컬 값 — Phase 3.3 옵션바(panel_arc_options.js)가 도구 필드를 직접 쓴다 → 공개 setter/getter + 클램프 규칙(width 1..64 정수일 때만, start/end finite 무제한)을 도구가 소유: set_width(i32)->bool 등"
    pointer_down: "button!=Left||doc 없음 → return. draw={x0,y0:round(ev), layer_id:active, fill_color:primary 스냅샷, outline_color:secondary 스냅샷, start,end,width,chord_mode 스냅샷, x1,y1=같음}; render"
    pointer_move: "draw 있으면 x1,y1=round(ev); render"
    pointer_up: |
      draw 없음 → return. draw 해제; render. x1,y1=round(ev). if x1==x0 || y1==y0 → return (둘 중 하나라도 같으면 그리지 않음 — 'AND' 아님)
      cx=(x0+x1)/2, cy 동일; rx=|x1-x0|/2, ry. fill=pack(parse(fill_color)), outline=pack(parse(outline_color))
      arc: mask=arc_mask(Box2{cx,cy,rx,ry}, start,end, width, W,H), color=fill. chord+Fill: chord_fill_mask(.., start,end,W,H) color=fill. chord+Outline: chord_outline_mask(.., start,end,width,W,H), color=outline(보조색!)
      stroke_begin(on_layer(layer_id).labeled(arc?"호":"현")) (Err → 반환; JS 는 throw) ; stroke_with: mask 의 1 인 칸마다 w.set(i%W, i/W, color) ; stroke_commit(Some(label))
    overlay: "draw 있으면 같은 마스크를 계산해 mask_to_blit(mask, packed(draw.색), Some(0.82)) — 색: arc/chord fill 은 fill_color, chord outline 은 outline_color. 성능 주의: 마스크가 캔버스 전체 크기(최대 2048×1088)이고 포인터 이동마다 재계산(JS 동일). 결과를 draw 의 (x1,y1,start,end,width,mode) 키로 캐시해 같은 입력이면 재사용"
    cancel/deactivate: "draw=None; render"
    near_parity_note: "arc/chord 래스터는 PIL 과 근사 일치(arc: 누락 0·초과 ≤16, chord fill 초과 ≤4, outline 누락 ≤16·초과 ≤40 — raster/arc/angle.rs near_parity). 도구는 엔진 결과를 그대로 신뢰"
  gradient_tool:
    id: radial_gradient; cursor: Crosshair
    fields: {inner_radius: "f64 기본 0", edge_mode: "Transparent|Solid 기본 Transparent", center: Option<Center>}
    options_rule: "inner_radius 는 정수일 때만 clamp(0..2048)(panel_gradient_options.js). edge_mode 는 'transparent'|'solid' 만"
    pointer_down: "button!=Left||doc 없음 → return. center={x,y:round(ev), layer_id, primary, secondary(스냅샷), inner_radius, edge_mode, x1,y1}; render"
    pointer_up: |
      center 없음 → return. 해제; render. radius=hypot(round(ev.x)-center.x, round(ev.y)-center.y). radius<1 → return
      inner=parse(primary), outer=parse(secondary). RadialGradient{cx,cy, r0=min(inner_radius, radius), r1=radius, stops=[Stop(0, inner.rgba), Stop(1, outer.r,g,b, edge_mode==Solid ? outer.a : 0)], w,h}
      mask=radial_gradient_mask(&g)?; stroke_begin(on_layer(layer_id).labeled("방사형 그라디언트")); mask.data[i]!=0 인 칸만 w.set(i%W, i/W, mask.data[i]) ; stroke_commit(Some("방사형 그라디언트"))
    overlay: "radius>=1: packed_to_blit(mask, alpha 0.82) + Circle{중심=((offsetX+cx*zoom)*dpr, ...), r=radius*zoom*dpr, rgba [255,255,255,230] (0.9*255≈230), width 1, dash (4,3) — dash 는 dpr 곱 없음(JS: setLineDash([4,3]) 그대로)}"
