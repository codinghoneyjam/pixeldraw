- id: W4
  title: input — 포인터·키보드·휠·커서 정규화 상태 머신 (2.6)
  wave: 1
  difficulty: medium
  read_first: [src/tools/input_controller.js, src/tools/pointer_bindings.js, src/tools/pointer_event.js, src/tools/keyboard_bindings.js, src/tools/wheel_accumulator.js, src/tools/cursor_state.js, "tests/ 에서 input/wheel/cursor 검색: rg -l 'InputController|WheelAccumulator|resolveCursor' tests", crates/engine/src/view/geom.rs, crates/engine/src/view/clamp.rs, crates/engine/src/view/zoom.rs]
  scope_note: "egui 이벤트 → 이 상태 머신 어댑터는 W8. 여기는 egui/winit import 0 (rg 로 검증)"
  verified_js_behaviour:
    build_tool_event: |
      sx=clientX-rect.left, sy 동일. f=screenToCanvas(view,sx,sy); p=pixelAt(view,sx,sy).
      rawList = getCoalescedEvents() 비어있지 않으면 그것, 아니면 [domEv]. 각 e: ef=screenToCanvas, ep={floor(ef.x), floor(ef.y)}; 직전 pts 끝과 같으면 건너뜀.
      pts 비면 [p]. 아니면 마지막이 p 와 다르면 p push.  → 불변: 마지막 원소 == (x,y).
      필드: x,y=p; fx,fy=f; sx,sy; button=domEv.button??0; shift; ctrl=ctrlKey||metaKey; alt; pointerId; pointerType; coalesced=pts; timeStamp
    pointer_down: |
      if drawPointerId!==null || panning → return (무시).  markInside.  if button===1 preventDefault.
      shouldPan(e) = button===1 || spaceDown || toolManager.active.id==='hand'.
      if shouldPan && (button===0||button===1): panning=true, panPointerId, panLast={sx,sy}, capture, applyCursor; return.
      if !toolAcceptsButton(button) return (tool.acceptsButton 없으면 button===0; 있으면 그 결과; 예외 → false)
      drawPointerId=pointerId; capture; toolManager.pointerDown(buildToolEvent)
    pointer_move: |
      syncInside(e, rect): panning 도 아니고 drawPointerId===null 이면 markInside(); 아니면 rect 로 inside 재계산(캡처 중 경계 이벤트 억제 대비). rect.right/bottom 이 숫자 아니면 변경 없음
      panning && pointerId==panPointerId: dx,dy = 현재-panLast; panLast 갱신; next=panBy(view,dx,dy); doc&&vp 있으면 clampView(next,w,h,vp.w,vp.h); setView; requestRender; return
      pointerId!==drawPointerId && drawPointerId!==null: pointerType!=='mouse' || (buttons??0)!==0 이면 return
      te=buildToolEvent. 그리는 중(drawPointerId==pointerId) → toolManager.pointerMove(te); return
      drawPointerId===null && !panning → toolManager.hover({x,y,fx,fy}); onHover({x,y})
    end_draw(kind up|cancel): |
      panning && pointerId==panPointerId → panning=false 정리 + applyCursor; return
      pointerId!==drawPointerId → return
      te=buildToolEvent; drawPointerId=null; up → toolManager.pointerUp(te), cancel → toolManager.cancel(); if !inside clearHover(= toolManager.hover(null), onHover(null)); applyCursor
      lostpointercapture: 위와 비슷하나 항상 toolManager.cancel() (pointerUp 아님)
    pointer_leave: "markInside(false); panning||drawPointerId!==null 이면 return; 아니면 clearHover()"
    wheel: |
      preventDefault. sx,sy=host 상대.
      shift===true: next=panBy(view, -(deltaY||0), 0); clamp; setView; requestRender; return   (deltaX 는 읽지 않음 — 주석 TL-DRAW-04 Q2, 트랙패드 가로 스크롤은 의도적으로 무시)
      pageH = getViewportSize()?.h ?? 0; steps = wheel.feed(deltaY??0, deltaMode??0, pageH); steps===0 → return
      nz = stepZoom(view.zoom, steps)  // 부호만 사용: >0 한 칸 위, <0 한 칸 아래(index.yaml corrections)
      next = zoomAt(view, sx, sy, nz); clamp; setView; requestRender
    wheel_accumulator: |
      feed(deltaY, deltaMode=0, pageHeight=0): px=Number(deltaY); !finite||0 → 0. deltaMode 1 → px*=16; 2 → px*=pageHeight||0; px==0 → 0.
      dir=sign(px). 방향이 바뀌면(_dir!==0 && dir!==_dir) residue=px (누적 폐기), 아니면 residue+=px. _dir=dir.
      steps=trunc(residue/60). steps!==0 → residue-=steps*60; return -steps. else 0.
      → 휠 위(deltaY<0) → residue<0 → steps<0 → 반환 양수 → 확대.  reset(): residue=_dir=0
    keyboard: |
      keydown(window): target 이 input/textarea/contentEditable 이면 무시. code==='Space'||key===' ': spaceDown 아니었으면 spaceDown=true; panning 도 아니고 drawPointerId===null 이면 applyCursor. preventDefault(항상)
      keyup: Space → spaceDown=false; !panning 이면 applyCursor
      blur: resetTransientState() (spaceDown=false,panning=false,panPointerId=null,panLast=null,drawPointerId=null) + toolManager.cancel() + applyCursor
      visibilitychange(hidden): resetTransient + toolManager.cancel() + (!inside 이면 clearHover) + applyCursor
      settings(activeTool 변경) → applyCursor
    cursor_ladder: "resolveCursor({inside=true,panning=false,spaceDown=false,toolCursor=null}): !inside → 'default'; panning → 'grabbing'; spaceDown → 'grab'; toolCursor 비어있지 않은 문자열이면 그것; 아니면 'default'"
  api: |
    pub struct RawPointer { pub pos: (f64, f64) /*호스트 상대 논리 px*/, pub coalesced: Vec<(f64, f64)> /*같은 프레임 중간 위치, 비어도 됨*/,
                            pub button: Button, pub buttons_down: u8, pub shift: bool, pub ctrl: bool, pub alt: bool,
                            pub pointer_id: u64, pub kind: PointerKind, pub time_ms: f64 }
    pub fn build_tool_event(raw: &RawPointer, view: &View) -> ToolEvent;
    pub enum WheelMode { Pixel, Line, Page }
    pub struct WheelAccumulator { /* residue: f64, dir: i32 */ } impl WheelAccumulator { pub fn feed(&mut self, delta_y: f64, mode: WheelMode, page_h: f64) -> i32; pub fn reset(&mut self); }
    pub fn resolve_cursor(inside: bool, panning: bool, space_down: bool, tool: CursorKind) -> CursorKind;   // 'Default' 폴백 포함
    pub enum ToolCall { Down(ToolEvent), Move(ToolEvent), Up(ToolEvent), Cancel, Hover(Option<HoverEvent>) }
    pub struct InputOutcome { pub tool_calls: Vec<ToolCall>, pub new_view: Option<View>, pub cursor: CursorKind, pub need_render: bool, pub capture: Option<bool> }
    pub struct InputCtx<'a> { pub view: View, pub canvas: Option<(u32, u32)>, pub viewport: Option<(f64, f64)>, pub active_tool_id: &'a str,
                              pub tool_accepts_button: &'a dyn Fn(Button) -> bool, pub tool_cursor: CursorKind, pub text_focus: bool }
    pub struct InputController { .. } impl InputController {
        pub fn new() -> Self;
        pub fn pointer_down(&mut self, raw: &RawPointer, ctx: &InputCtx) -> InputOutcome;
        pub fn pointer_move(&mut self, raw: &RawPointer, ctx: &InputCtx) -> InputOutcome;
        pub fn pointer_up(&mut self, raw: &RawPointer, ctx: &InputCtx) -> InputOutcome;
        pub fn pointer_cancel(&mut self, pointer_id: u64, ctx: &InputCtx) -> InputOutcome;
        pub fn pointer_leave(&mut self, ctx: &InputCtx) -> InputOutcome;
        pub fn wheel(&mut self, delta_y: f64, mode: WheelMode, shift: bool, pos: (f64, f64), ctx: &InputCtx) -> InputOutcome;
        pub fn key_down(&mut self, k: &KeyEvent, ctx: &InputCtx) -> InputOutcome;   // Space(text_focus 아닐 때) → space_down
        pub fn key_up(&mut self, k: &KeyEvent, ctx: &InputCtx) -> InputOutcome;
        pub fn focus_lost(&mut self, ctx: &InputCtx) -> InputOutcome;               // blur/visibility hidden: reset_transient + ToolCall::Cancel
        pub fn is_drawing(&self) -> bool; pub fn is_panning(&self) -> bool;
    }
  translation_notes:
    - "egui 는 포인터 캡처를 Response::dragged 로 유지 → capture 필드는 상태 일관성용. lostpointercapture 에 해당하는 이벤트가 없으므로 W8 가 포인터가 창 밖에서 놓일 때 pointer_cancel 대신 pointer_up 을 호출하도록 어댑터에서 처리"
