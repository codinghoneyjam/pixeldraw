- id: W5
  title: tools-core — pen / eraser / fill / eyedropper / hand + ToolManager (2.7a)
  wave: 2
  difficulty: hard
  needs: [W0, W1]
  read_first: [src/features/pen/pen.js, src/features/pen/brush.js, src/features/fill/fill.js, src/features/eyedropper/eyedropper.js, src/features/hand/hand.js, src/tools/tool_base.js, src/tools/tool_manager.js, "rg -l 'PenTool|FillTool|EyedropperTool|ToolManager' tests", crates/engine/src/raster/brush.rs, crates/engine/src/kernels.rs, crates/engine/src/composite.rs(sample_pixel), crates/engine/src/pixel.rs]
  rust_apis_verified:
    - "raster::brush::{stroke_point(sink,x:i32,y:i32,n:usize,packed:u32), stroke_segment(sink,x0,y0,x1,y1,n,packed), stamp_brush, brush_footprint(n)->EngineResult<BrushFootprint{.. is_set(x,y), offset}>}; PixelSink 는 PixelWriter 가 구현"
    - "kernels::flood_fill_scanline<S:PixelSink>(sink, w,h, sx,sy, seed, fill)(kernels.rs:84; 정확한 인자 순서는 읽을 것) — 재구현 금지"
    - "composite::sample_pixel(&[LayerSource], x,y,w,h)->Rgba; Document::layer_sources()"
    - "pixel::{parse_hex(&str)->Option<Rgba>, pack_rgba_bytes(r,g,b,a), unpack_rgba(u32)->Rgba, to_hex8(f64,f64,f64,f64)->String}"
    - "Layer.store: ChunkStore — get_pixel(x:u32,y:u32)->u32 (캔버스 밖 0)"
  tool_design: |
    상태는 도구 구조체 필드, 스트로크 수명은 Session(W1). JS `this._edit` → `drawing: bool` 로 대체.
    쓰기: cx.session.stroke_with(|w| stroke_segment(w, x0,y0,x1,y1, n, packed)) — PixelWriter 가 PixelSink.
    flush: cx.session.stroke_flush(). 종료: cx.session.stroke_commit(Some(label)) (실패는 삼킴 — JS 의 빈 catch). 취소: stroke_cancel().
  pen_eraser:
    ids: {draw: pen, erase: eraser}
    labels: {draw: "연필", erase: "지우개"}
    fields: [mode, drawing, ignore_stroke, size: usize, packed: u32, last_point: Option<(i32,i32)>, hover: Option<(i32,i32)>]
    cursor: {draw: Crosshair, erase: Cell}
    pick_color: "erase → 0. draw → parse_hex(settings.primary_color) → pack_rgba_bytes(r,g,b,a); 파싱 실패 → pack(0,0,0,255)"
    pointer_down: |
      ev.button != Left → return.  drawing → return.
      ev.alt → eyedrop(ev) 후 return (스트로크 시작 안 함).
      match session.stroke_begin(EditOptions::on_active_layer().labeled(label)): Err → ignore_stroke=true, drawing=false, return (엔진이 잠김/숨김 status 를 이미 emit)
      drawing=true; ignore_stroke=false; size=settings.pen_size; packed=pick_color()
      if ev.shift && last_point.is_some(): stroke_segment(last→ev) ; last_point=ev; stroke_flush(); finish_up(); return
      stroke_point(ev); last_point=ev; hover=ev; stroke_flush()
    pointer_move: "ignore_stroke||!drawing → return. pts = ev.coalesced (비어있으면 [(x,y)]). 각 pt: stroke_segment(last_point→pt); last_point=pt. hover=last_point. stroke_flush()"
    pointer_up: |
      ignore_stroke → ignore=false, drawing=false, return.  !drawing → return.
      ev 가 last_point 와 다르면 한 번 더 stroke_segment 후 last_point=ev; hover=ev. finish_up()
    finish_up: "drawing=false; ignore=false; stroke_commit(Some(label)) — 에러 삼킴"
    cancel/deactivate: "stroke_cancel(); drawing=false; ignore_stroke=false; deactivate 는 last_point=None 도"
    activate: "last_point=None"
    on_model_event: "DocumentReplaced → last_point=None. Layers{reason:Active} → last_point=None"
    eyedrop: |
      doc 없음 → return. rgba=sample_pixel(layers,x,y,w,h). rgba[3]==0 → session.notify("info","투명 픽셀","") ; return   (JS notify(level,text) — code 없음 → "" 또는 notify 의 code 인자에 빈 문자열; 엔진 시그니처 notify(level,text,code:&'static str))
      else session.set_setting("primaryColor", SettingInput::Str(&to_hex8(r,g,b,a)))  (연필 alt-클릭은 항상 primary)
    hover: "hover = ev.map(|e|(e.x,e.y)); request_render"
    overlay: |
      pos = drawing ? (hover ?? last_point) : hover.  pos 없음 → return.  (드로잉 중에만 last_point 폴백 — 포인터가 캔버스를 떠난 뒤 낡은 픽셀에 프리뷰가 남는 버그 방지(JS 주석))
      n = drawing ? self.size : settings.pen_size(없으면 1)
      zoom>=2: fp=brush_footprint(n). 풋프린트 셀마다 FillRect(rgba [255,255,255,89]  (0.35*255=89.25→ JS 는 'rgba(255,255,255,0.35)' f64 알파: OverlayOp 는 u8 → 89)) 위치 = pixelToDevice(pos.x-fp.offset+bx, pos.y-fp.offset+by), 크기 max(1,zoom*dpr).
               이어서 difference StrokeRect(+0.5,+0.5 오프셋, 크기 n*zoom*dpr, 지우개는 dash (4*dpr, 2*dpr)) 흰색 alpha 1
      zoom<2: difference 십자선 중심 (pos+0.5) 반경 5*dpr, 흰색
      pixelToDevice(x,y) = ((offsetX + x*zoom)*dpr, (offsetY + y*zoom)*dpr)
  fill:
    id: fill; label: "페인트통"; cursor: Copy
    pointer_down: |
      ev.button != Left → return. doc 없음 → return. 좌표가 [0,w)×[0,h) 밖 → return.
      stroke_begin(labeled("페인트통")) Err → return (JS: catch → return, 상태바 경고는 엔진이 emit)
      seed=layer(active).store.get_pixel(x,y);  fill=parse(primary)→pack, 실패 → pack(0,0,0,255)
      seed==fill → session.notify("info","이미 같은 색입니다",""); stroke_cancel(); return
      stroke_with(|w| flood_fill_scanline(w, ...)) ; stroke_commit(Some("페인트통"))   (한 번의 stroke_with 안에서 완료)
      주의: seed 를 읽을 때 활성 레이어를 doc.get_layer(active_layer_id) 로 — begin_edit 이후에 읽어도 동일(스트로크 시작은 데이터를 안 바꿈)
  eyedropper:
