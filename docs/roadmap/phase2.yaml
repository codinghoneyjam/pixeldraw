    - {name: CANVAS_HOST_BG_RGB, value: "[60,63,69]", js: "style_base.css --canvas-bg #3c3f45 (디자인 토큰). 문서 밖 영역 색 — display 프레임버퍼 초기색", note: "CSS 토큰이므로 style_base.css 를 읽어 값을 재확인"}
