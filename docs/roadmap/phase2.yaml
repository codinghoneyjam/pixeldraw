    hover: "pos=ev.map(..); request_render"
    overlay: "pos 있으면 difference StrokeRect 흰색(pos 의 장치 좌표 + 0.5, 크기 max(1, zoom*dpr))"
  hand: "id hand; cursor Grab; 핸들러 없음(팬은 InputController 가 처리; InputController 가 id=='hand' 를 보고 좌클릭을 팬으로 가로챔)"
  tool_manager:
