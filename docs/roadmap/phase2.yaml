- id: W12
  title: text_mask — 텍스트 도구용 래스터 + 글리프 디코드 (엔진)
  wave: 1
  difficulty: medium
  why: "TextTool(JS)이 core/raster/text_mask.js 를 쓰는데 Rust 엔진에는 없음(recipe/text.rs 는 레시피 렌더러이고 API 가 다름)"
  read_first: [src/core/raster/text_mask.js, src/features/text/glyph_set.js, src/features/text/text_tool.js, crates/engine/src/recipe/text.rs, crates/engine/src/blend.rs(over), tools/recipe/text_glyphs.json 의 구조(최상위 키만; 135KB)]
  verified_js:
    text_mask: |
      textMask({text, glyphs, x, y, fill, stroke, strokeWidth, strokeMode, w, h}) -> {w,h,data:Uint32Array(w*h)}
      assertMaskSize(w,h). placed = placeText(glyphs,text,x,y). fillRgb=unpack(fill>>>0)[0..3]; strokeRgb=unpack((stroke ?? fill)>>>0)[0..3]; sw=trunc(strokeWidth??0)
      if (stroke !== 0 && sw > 0): mode = strokeMode ?? 'shape'. 각 글자: shaped = mode==='shape' ? glyph.shaped?.[String(sw)] : undefined.
         shaped 있으면 stampGlyph(shaped, p.x - glyph.dx + shaped.dx, p.y - glyph.dy + shaped.dy, strokeRgb)
         없으면 디스크 스탬프: for ox in -sw..=sw, oy in -sw..=sw if ox*ox+oy*oy <= sw*sw → stampGlyph(glyph, p.x+ox, p.y+oy, strokeRgb)
      그다음 모든 글자 fill 스탬프: stampGlyph(glyph, p.x, p.y, fillRgb)
      stampGlyph: 각 (gx,gy): cov=alpha[gy*w+gx]; cov==0 skip; 캔버스 밖 skip; i=y*W+x; blended = over(unpack(data[i]), [r,g,b,cov], 1); data[i]=pack(blended)
      주의: 'stroke !== 0' 비교는 packed u32 stroke 값이 0(완전 투명 흑색)인지 — TextTool 은 secondaryColor 를 항상 packRGBA 로 넘김(알파 0 인 색은 normHex 로 설정 불가라 stroke!==0 항상 참)
    place_text: "pen=penX; 각 ch: g=glyphs[ch] (없으면 DrawToolError UNSUPPORTED_LAYER_TYPE `glyph missing for ${JSON.stringify(ch)}`); x=round(pen+g.dx), y=round(penY+g.dy) (Math.round); pen+=g.advance"
    measure_text: "placeText(glyphs,text,0,0) → minX/minY/maxX/maxY. 비면 모두 0. x0=min(0,minX); advanceRight = last.x - last.glyph.dx + last.glyph.advance; x1=max(maxX, advanceRight); h는 ink 기반. (TextTool 은 measure 안 씀 — 구현은 선택, recipe 용 테스트가 있으면 필요)"
    decode_glyph_sets: "raw.fonts[name]{path,size,glyphs{ch:{advance,dx,dy,w,h,alpha_b64,shaped{strokeWidth:{dx,dy,w,h,alpha_b64}}}}} → alpha 는 base64 → w*h 바이트(길이 불일치 RangeError 'invalid glyph alpha size'). 폰트 이름: 'default-42', 'monogram-240'"
    tool_error_notify: "TextTool: glyphs 없으면 notify('warn','텍스트 글꼴을 불러오지 못했습니다','TEXT_FONT_MISSING'); 지원 안 하는 문자 → notify('warn', `지원하지 않는 문자: ${ch}`, 'TEXT_GLYPH_MISSING') — 이 두 code 는 errors CATALOG 에 없는 notify 전용 문자열(Session::notify 의 code 는 &'static str)"
  rust_existing: "recipe/text.rs: include_str!(tools/recipe/text_glyphs.json) 로 GLYPH_DATA 보유, 비공개 struct Glyph{advance,dx,dy,w,h,alpha,shaped: Map<String,Value>}, fn glyph(v)->Glyph, fn stamp(...), fn render<S:PixelSink>(...). 중복 정의를 피하되 recipe/ 는 W12 write_scope 밖 → 새 모듈이 자체 Glyph 타입을 가진다(중복 허용, 이유를 주석 1줄)"
  api: |
    // raster/text_mask.rs 파사드 (+ text_mask/{glyph,place,stamp}.rs)
    pub struct GlyphShape { pub dx: i32, pub dy: i32, pub w: usize, pub h: usize, pub alpha: Vec<u8> }
    pub struct Glyph { pub advance: f64, pub dx: i32, pub dy: i32, pub w: usize, pub h: usize, pub alpha: Vec<u8>, pub shaped: BTreeMap<u32, GlyphShape> }
    pub struct GlyphSet { pub path: String, pub size: f64, pub glyphs: HashMap<char, Glyph> }
    pub fn decode_glyph_sets(raw: &serde_json::Value) -> EngineResult<BTreeMap<String, GlyphSet>>;
    pub struct PlacedGlyph<'a> { pub ch: char, pub x: i32, pub y: i32, pub glyph: &'a Glyph }
    pub fn place_text<'a>(glyphs: &'a HashMap<char, Glyph>, text: &str, pen_x: i32, pen_y: i32) -> EngineResult<Vec<PlacedGlyph<'a>>>;
    pub struct TextParams<'a> { pub text: &'a str, pub glyphs: &'a HashMap<char, Glyph>, pub x: i32, pub y: i32, pub fill: u32, pub stroke: u32, pub stroke_width: i32, pub shape_stroke: bool /*strokeMode==='shape'*/, pub w: usize, pub h: usize }
    pub fn text_mask(p: &TextParams) -> EngineResult<GradientMask-유사 {w,h,data:Vec<u32>}>;   // raster::gradient::GradientMask{w,h,data:Vec<u32>} 재사용 가능(필드 동일). 재사용 여부는 W12 가 결정하고 로그에
  oracle: "tools/text_mask_cases.mjs: JS textMask 를 작은 합성 글리프 세트(손으로 만든 3글자, shaped 유무)로 실행해 data 해시/전체 u32 배열을 JSON 으로 덤프 → Rust 와 정확 비교. 실제 text_glyphs.json 케이스 2~3개(default-42 'AB', monogram-240 'a', 외곽선 sw=2)도 포함"
  tests: ["오라클 정확 일치", "place_text 정수 pen(Math.round 음수 .5 케이스)", "글리프 누락 에러 코드 UNSUPPORTED_LAYER_TYPE 와 메시지 JSON 인용부호 형식", "디스크 스탬프 vs shape 스탬프 분기", "캔버스 밖 클립", "alpha 길이 불일치 에러", "text_glyphs.json 전체 디코드가 성공하고 두 폰트 존재"]
  accept: ["테스트 + 게이트", "300줄 이하 분할(파사드 + glyph/place/stamp)"]

