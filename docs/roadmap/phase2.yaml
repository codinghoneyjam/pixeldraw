      (좌클릭+Shift=보조, 우클릭=보조, 우클릭+Shift=보조(Shift 규칙이 이김 — 레거시 동작))
    pointer_down: "acceptsButton 아니면 return. down=true; btn=ev.button(래치: pointermove 의 button 은 -1 이라 우클릭 드래그를 재지정하면 안 됨); pos; pick"
