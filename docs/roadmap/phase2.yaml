# ─────────────────────────────────────────────────────────────────────────────
- id: W3
  title: comp_cache — dirty 청크 합성 캐시 + 6ms 예산 (2.4)
  wave: 1
  difficulty: medium
  read_first: [src/render/renderer_composite.js, "src/render/renderer.js (SUBS, _onPixels/_onLayers/_onSettings/_update/invalidate*)", crates/engine/src/composite.rs, crates/engine/src/model/event.rs, crates/engine/src/model/command.rs, crates/engine/tests/e2e_session.rs]
  verified_js_behaviour:
    events:
      DocumentReplaced: "_setDocument → ensureComp(재할당 시 dirtyAll=true) 후 invalidateAll(): 항상 전체 무효화. 렌더 재요청"
      PixelsChanged: "detail.all===true → invalidateAll; chunks 배열 → invalidateChunks; 항상 requestRender"
      LayersChanged: "reason==='active' → return(무효화·렌더 없음). reason==='prop' && field==='name' → return — 그러나 session.js:90 이 field 를 안 실어 보내므로 죽은 코드(index.yaml corrections). 그 외 전부 invalidateAll + requestRender"
      SettingsChanged: "key==='gridMode' → requestRender 만(합성 무효화 없음)"
      others: "무시"
    invalidate_chunks: "정수·비음수 cx/cy 만 dirty 에 추가. 상한 검사 없음(캔버스 밖 청크도 들어감, 칠해도 무해) → Rust 는 캔버스 밖을 건너뜀(allowed_deviation: 화면 결과 동일)"
    paint_dirty: |
      vis = visibleChunkRange(view, w, h, cssW, cssH)  (None 이면 가시 청크 없음)
      keys = [...dirty]  (삽입 순서 스냅샷)
      1) keys 중 가시 청크는 예산 없이 전부 합성 → dirty 에서 제거
      2) t0 = now (가시 패스 이후에 측정!). 남은 keys 를 순회: dirty 에 없으면 skip; `now - t0 > 6ms` 이면 break; paint
      즉 예산은 비가시 청크에만 적용되고 예산 검사는 청크 하나를 칠하기 '전'에 한다
    update: "_update: 문서 크기 변경 시 ensureComp; dirtyAll 이면 dirty=전 청크(cy<h/32, cx<w/32) 로 확장 후 dirtyAll=false; dirty.size>0 이면 paintDirty; (drawDisplay); dirty 남았거나 dirtyAll 이면 requestRender"
    ensure_comp: "크기 같으면 no-op, 다르면 새 w×h 투명 버퍼 + dirtyAll=true. 캔버스 크기는 항상 32 배수(is_valid_canvas_size)"
    resize_invalidates_all_in_js: "JS resize() 는 디스플레이 캔버스 크기가 바뀌면 invalidateAll() — 합성 캐시와 무관한 낭비. Rust 는 뷰포트 변경에 합성을 무효화하지 않음(allowed_deviation: 가시 청크는 어차피 dirty 면 칠해짐)"
  api: |
    pub enum Budget { Unlimited, Time(std::time::Duration), Chunks(usize) }   // Chunks 는 테스트용 결정적 예산(R12). Time 은 Instant 사용
    pub struct CompCache { /* width,height, comp: Vec<u8>, dirty: BTreeSet<u64>, dirty_all: bool, last_painted: usize */ }
    impl CompCache {
        pub fn new() -> Self;
        pub fn ensure(&mut self, canvas_w: u32, canvas_h: u32);          // ensureComp
        pub fn invalidate_all(&mut self);
        pub fn invalidate_chunks(&mut self, chunks: &[(u32, u32)]);
        /// 반환: 렌더(프레임) 재요청 필요 여부. 표: verified_js_behaviour.events. Settings 는 key 가 GridMode 일 때만 true
        pub fn apply_event(&mut self, ev: &ModelEvent) -> bool;
        /// 반환: 아직 dirty 가 남았는지
        pub fn paint_dirty(&mut self, layers: &[LayerSource<'_>], visible: Option<VisibleChunkRange>, budget: Budget) -> bool;
        /// JS _update 의 합성 절반: ensure(doc.canvas) → dirty_all 확장 → paint_dirty(doc.layer_sources(), ..)
        pub fn update(&mut self, doc: &Document, visible: Option<VisibleChunkRange>, budget: Budget) -> bool;
        pub fn comp(&self) -> &[u8];      // w*h*4 RGBA(straight alpha). 아직 안 칠한 칸은 투명(0)
        pub fn size(&self) -> (u32, u32);
        pub fn dirty_len(&self) -> usize;
        pub fn last_painted(&self) -> usize;   // 마지막 paint_dirty 가 칠한 청크 수(테스트·HUD)
    }
  implementation_notes:
    - "composite_chunk(layers, cx, cy, &mut [u8;4096]-슬라이스) -> EngineResult<bool>: 지역 4096B 버퍼에 합성 후 comp 에 행 복사(행 stride = w*4, 청크 행 32개 × 128B)"
    - "dirty 순회 순서: JS Set=삽입 순, Rust BTreeSet<u64>=(cy,cx) 정렬. 결과 픽셀에는 영향 없고 예산 컷오프 시 어느 청크가 먼저 칠해지는지만 다름 → docs/render.md 한 줄"
    - "invalidate_all 은 dirty_all=true 로만 표시하고 update 에서 확장(JS 와 동일) — 문서 크기를 모르는 상태에서도 호출 가능"
    - "Document::layer_sources() 존재(model/document/types.rs:82). 레이어 0=맨 아래"
  tests:
    - "단일 레이어 점 하나 → update 후 comp 의 전 픽셀이 sample_pixel 과 일치(작은 문서 전 픽셀 스윕)"
    - "dirty 가 비면 두 번째 update 는 합성 0개(last_painted==0)"
    - "이벤트 표 6행(DocumentReplaced, PixelsAll, PixelsChunks, Layers(active → false), Layers(prop) → true+invalidate_all, Settings(GridMode) → true 무효화 없음, Settings(PenSize) → false)"
    - "Budget::Chunks(0): 가시 청크는 전부 칠해지고 비가시는 0개. Budget::Unlimited: 전부"
    - "resize_canvas 후 ensure 가 재할당 + 전체 dirty"
    - "캔버스 밖 청크 invalidate 는 무시(dirty_len 불변)"
    - "e2e(tests/comp_cache.rs): Session.subscribe 클로저로 Rc<RefCell<VecDeque<ModelEvent>>> 큐에 모아 apply_event 에 먹임 — 펜 스트로크(begin_edit 경로로 충분) → undo → redo → 각 단계에서 comp == flatten_to_rgba(include_background=false 와 동치인 투명 base) 와 바이트 동일. 이 큐 패턴을 W8 가 재사용하므로 '패턴 예제' 주석 1줄"
  accept: ["위 테스트 + 게이트", "docs/render.md 에 comp_cache 절"]

