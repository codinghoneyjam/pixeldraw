    api: |
      pub struct SettingsStore { path: PathBuf, pending: Option<Instant>, data: StoredSettings }
      impl SettingsStore { pub fn load(path) -> Self; pub fn restore_into(&self, session: &mut Session);   // PERSIST_KEYS 순서, 키별 실패 무시
