  spec: |
    SidePanel::left 고정 폭 44. 버튼 36×36 × 14, 구분선 2개(폭 28 높이 1 #3a3d43, 마진 4). 순서: pen, eraser, fill, eyedropper | line, rect, rrect, ellipse, polygon, arc, chord, radial_gradient, text | hand
    타이틀: 펜 (B), 지우개 (E), 페인트통 (G), 스포이트 (I), 직선 (L), 사각형 (R), 둥근 사각형 (U), 타원 (O), 다각형 (P), 호 (A), 현 (C), 방사형 그라디언트 (V), 텍스트 (T), 손 (H)
