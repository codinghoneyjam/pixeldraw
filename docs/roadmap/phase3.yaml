                           pub fn set_recent(&mut self, v: Vec<String>); pub fn set_collapsed(..); pub fn set_panel_widths(..) }
    time: "Instant 주입(R12). 별도 스레드 금지(Session 이 !Send 일 수 있음) — 프레임 루프의 tick 에서 저장"
