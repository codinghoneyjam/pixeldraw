- id: "3.10a"
  title: autosave_core — 레코드 스키마·검증·스케줄러 (순수)
  wave: A
  needs: [phase2.W9]
  write_scope: [crates/app/src/ui/autosave.rs, "crates/app/src/ui/autosave/**"]
  js_facts_verified:
    idb: {db: "draw_tool_v2 (version 1)", stores: ["meta(keyPath 'key'): 단일 레코드 key='current'", "chunks(keyPath 'key', index byLayer(layerId))"]}
    meta_record: '{key:"current", schema:2, documentId, name, canvas:{widthPx,heightPx,background}, layers:[{id,name,visible,locked,opacity,blend}], activeLayerId, updatedAt:Date.now()}'
    chunk_record: "{key:`${layerId}|${cy}|${cx}`, layerId, cx, cy, data: 4096 바이트 RGBA}"
    meta_valid: "schema===2; documentId 비어있지 않은 string; canvas 크기 is_valid_canvas_size; layers 1..64; 각 layer: id/name string, visible/locked boolean, opacity 유한 0..1 (blend 는 미검증이나 Layer 생성자에서 거부 가능 ?)"
    load: "meta 없으면 None. 검증 실패 → clear() 후 None. blend 없으면 'normal'. 청크: layer 존재, cx/cy 정수, byteLength==4096 인 것만 putChunk. activeLayerId 없으면 마지막(최상위) 레이어. Document 생성 예외 → clear() 후 None. name 폴백 'Untitled'"
    schedule: "구독: PIXELS_CHANGED(all→레이어 전체 재기록, chunks→해당 청크), LAYERS_CHANGED(meta), DOCUMENT_REPLACED(meta+chunks clear 후 전 레이어 청크 put). 첫 이벤트부터 800ms 디바운스(타이머는 이미 있으면 리셋 안 함 — 'if(!_timer)') + 5000ms 강제 플러시 상한. flushNow 는 진행 중이면 같은 promise 재사용"
    flush: "dirty 없으면 즉시 반환. meta 는 매 flush 마다 재생성(updatedAt 갱신). 한 트랜잭션: 사라진 레이어(knownLayers − current)의 청크 삭제, dirty 청크 put/삭제(레이어 안에서 사라진 청크는 delete)"
    failure: "QuotaExceededError → notify('warn','자동저장 공간 부족','STORAGE_QUOTA'); 그 외 → notify('warn','자동저장 실패','INVALID_STATE'). dirty 유지 → 다음 스케줄에서 재시도"
    triggers: "visibilitychange(모든 변화)와 pagehide 에서 즉시 flush → egui: 창 포커스 상실/종료 요청에서 flush"
    not_saved: "undo 스택·설정은 저장하지 않음. 복원 시 dirty 로 표시(load_document(.., mark_saved=false))"
  rust_design:
    format: "단일 파일(platform::autosave_file()). 형식은 자유(예: 길이 접두 바이너리 또는 JSON+base64)이되 위 의미 보존. 원자적 쓰기(write_bytes_atomic). 청크 단위 증분 대신 '전체 재기록'도 허용(성능은 Phase 5 에서 평가) — 단 800ms/5000ms 스케줄과 실패 경고 2종 문구는 보존"
    api: |
      pub struct AutosaveRecord { meta: Meta, chunks: Vec<(String /*layer*/, u32, u32, Box<[u8; 4096]>)> }
      pub fn build_record(doc: &Document) -> AutosaveRecord;                       // idb_record_builder.js
      pub fn load_record(rec: &AutosaveRecord) -> Result<Document, AutosaveReject>;   // 검증+복원, 거부 이유는 로그
      pub struct Scheduler { /* first_dirty: Option<Instant>, timer: Option<Instant> */ } // 800ms 디바운스(리셋 안 함) + 5000ms 상한. Instant 주입
      pub enum Dirty { All(layer), Chunks(layer, Vec<(u32,u32)>), Meta, Replace }
  tests: ["build→load 라운드트립(레이어 속성·블렌드·active·청크 픽셀)", "검증 거부 케이스 표(schema!=2, 빈 documentId, 잘못된 캔버스 크기, 레이어 0개/65개, opacity NaN/>1, 청크 byteLength!=4096)", "스케줄러: 첫 이벤트 후 800ms, 이벤트가 계속 와도 타이머 리셋 안 함, 5000ms 상한", "사라진 레이어 청크 정리", "마지막 레이어를 active 로 폴백"]

- id: "3.4a"
  title: color_math — HSV·hex·normHex 순수 모듈
  wave: A
  write_scope: [crates/app/src/ui/color/math.rs]
  exact_js: |
    상수: WHEEL_PX=132, RING_OUT=66, RING_IN=55.5, RING_MID=60.75, RING_CLEARANCE=3, SV_PX=floor((2*(55.5-3))/SQRT2)=74
    angleToHue(dx,dy) = (atan2(dy,dx)*180/PI + 450) % 360   → 0°=위(12시), 시계방향 증가
    hsvToRgb(h,s,v): hue=((h%360)+360)%360, c=v*s, x=c*(1-|((hue/60)%2)-1|), m=v-c, 6구간 표, 각 채널 Math.round((val+m)*255)
    rgbToHsv(r,g,b): d=mx-mn; d>0 일 때 mx==r → 60*(((g-b)/d)%6), mx==g → 60*((b-r)/d+2), else 60*((r-g)/d+4); h<0 이면 +360; s=mx==0?0:d/mx; v=mx   (입력 0..255 → v 는 0..1 로 정규화되는지 원문 확인)
    setHueSV(h,s,v): s>0.02 && v>0.02 && finite(h) 일 때만 state.h 갱신(무채색/검정에서 hue 유지); s,v 는 [0,1] 클램프. 초기 state {h:0,s:1,v:1}
    normHex(v): parseHex 실패 또는 a===0 → None; a===255 → '#rrggbb'; 그 외 '#rrggbbaa'. parseHex 는 '#' 필수, 3/6/8자리 hex 만(공백 trim, 소문자화)
    hsvToHex(opaque) + withSlotAlpha: 휠 pick 은 불투명 hex 를 만든 뒤 현재 슬롯 알파를 재부착(a!==255 면 hex+'aa' 2자리 소문자)
    pointerToSv: border 제외 내용 박스 기준 s=clamp((x-left-border)/width), v=1-clamp((y-top-border)/height) — 모서리 도달 가능
    Math.round 주의: JS Math.round(.5)=1, Math.round(-.5)=-0. blend::rnd(floor(v+0.5)) 재사용
  tests: ["hsv↔rgb 라운드트립 표(경계 hue 0/60/120/…/360, s=0, v=0)", "무채색에서 hue 유지", "normHex 표(3/6/8자리, 대문자, 공백, '#' 없음, a=0, a=255, a=128)", "angleToHue 사분면", "SV 모서리"]
  accept: "JS tests/color_*.test.mjs(rg -l 'hsvToRgb|normHex' tests)가 있으면 케이스를 그대로 포팅"

- id: "3.6a"
  title: status_format — 상태바 포맷 순수 함수
  wave: A
  write_scope: [crates/app/src/ui/status/format.rs]
  exact_js: |
    OUTSIDE_POS='- , -' (양 필드). pos null/NaN → 둘 다 이 문자열
    formatGridCoords: px=floor(x), py=floor(y); cx=floor(px/32), tx=floor(px/64). px 필드 `${px}, ${py} px`; 셀 필드 `셀 ${cx}, ${cy} (32px) · 타일 ${tx}, ${ty} (64px)` (· = U+00B7)
    줌 `${Math.round(zoom*100)}%`; 캔버스 `${w} × ${h} px (${w/64} × ${h/64} 타일)` — w/64 소수 가능(예 96→1.5), 반올림 없음. × = U+00D7
    도구 `STRINGS.tools[id] ?? id`; dirty '●'(색 #ffb020) 아니면 빈 문자열
    메시지 수명: INFO_MS=4000, WARN_MS=8000, error 는 만료 없음(다음 메시지가 덮어쓸 때까지). 만료 시 level 이 그대로일 때만 비움. 색 warn #ffb020, error #ff5c5c
    7칸 순서: [메시지][커서 px][셀·타일][줌][캔버스][도구][dirty ●]. 스타일 mono 12px, gap 12, min-height 24, bg #232428, border-top #3a3d43
  tests: ["formatGridCoords 표(음수·0·경계 31/32/63/64)", "JS 'tests/statusbar*.test.mjs' 포팅(rg -l 'formatPosition|formatGridCoords')", "f64 줌 반올림(0.25→25%, 3→300%)", "w/64 소수 표기(JS String(1.5)='1.5', 정수는 '8' — Rust Display 와 동일한지 확인)"]

- id: "3.1b"
  title: shortcuts — 단축키 해석 순수 모듈
  wave: A
  write_scope: [crates/app/src/ui/actions/shortcuts.rs, crates/app/src/ui/actions/action.rs]
  read_first: [src/ui/toolbar/shortcuts.js, src/ui/actions/action_map.js]
  exact_js: |
    처리 순서(createShortcuts keydown): (1) key===' ' → false(스페이스는 핸드 패닝에 양보) (2) 편집 타깃이면 Esc 만 blur 로 소비, 나머지 무시 (3) busy 면 무시 (4) toolManager.keyDown({key,shift,ctrl,alt}) 가 true 반환하면 소비(Enter/Esc/방향키 등 도구 키) (5) resolveShortcut
    normKey: 한 글자는 소문자화. alt 가 true 면 무조건 null. ctrl||meta → ctrl 로 취급. e.repeat 가드 없음(누르고 있으면 반복: x 스왑 깜박임, [ ] 반복 스텝)
    Ctrl(또는 Cmd): N=file.new, Shift+N=layer.add, O=file.open, S=file.save, E=file.exportPng, Z=edit.undo, Shift+Z=edit.redo, Y=edit.redo, J=layer.duplicate, Shift+M=layer.mergeDown, ]=layer.up, [=layer.down, '=view.gridCycle, 그 외 Ctrl 조합은 null
    단독(Shift 무관): + 또는 = → view.zoomIn, - → view.zoomOut, 0 → view.fit, 1 → view.actual
    도구: B=pen E=eraser G=fill I=eyedropper L=line R=rect U=rrect O=ellipse P=polygon A=arc C=chord V=radial_gradient T=text H=hand
    색: X=color.swap, D=color.reset
    펜 크기: [ → −1, Shift+[({) → −5, ] → +1, Shift+](}) → +5 (clamp 1..64; brush.step 액션 우선, 폴백 clamp)
    레이아웃 의존: '['/'{' 와 ']'/'}' 는 Shift 시 key 값이 바뀌는 US 가정 → egui 에서는 물리 키(OpenBracket/CloseBracket) + modifiers.shift 로 매핑. JS 에서 Ctrl+Shift+] / Ctrl+Shift+[ 는 key 가 '}'/'{' 라서 매칭 안 됨(null) — 패리티는 null 유지(물리 키 매핑 시 이 케이스를 일부러 null 로 남겨 둘 것)
    undo: requestUndo 우선(보류 도형 있으면 폐기만), redo: 보류 중이면 무시. tool=setSetting('activeTool'), penSize=brush.step(delta)
  action_ids_25: [file.new, file.open, file.save, file.exportLayer, file.importLayer, file.exportPng, file.importRecipe, file.exportVector, file.importVector, edit.undo, edit.redo, canvas.resize, view.zoomIn, view.zoomOut, view.fit, view.actual, view.gridCycle, layer.add, layer.duplicate, layer.remove, layer.mergeDown, layer.up, layer.down, brush.step, color.swap, color.reset]   # 26개로 보이면 JS action_map.js 가 정답
  api: "pub enum Action{..}; pub struct KeyInput{key:String, physical: Option<PhysKey>, shift,ctrl,alt}; pub fn resolve_shortcut(k:&KeyInput, ctx:&ShortcutCtx)->Option<ActionCall>  // ActionCall = Action | SetTool(&'static str) | BrushStep(i32) — 순수 함수"
  tests: ["표 전수(위 규칙 각 행) + Alt 무시 + Ctrl+Shift+] null + repeat 허용", "JS 'tests/shortcuts*.test.mjs' 포팅(rg -l resolveShortcut)"]

