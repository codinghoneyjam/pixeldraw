  needs: [phase2.W9]
  write_scope: [crates/app/src/ui/settings_store.rs, "crates/app/src/ui/settings_store/**"]
  js_facts:
    keys: {settings: "dt.settings.v1", recent: "dt.recentColors", panels: "dt.panelWidths.v1"}
    persist_keys_order: [primaryColor, secondaryColor, penSize, gridMode, snapUnit, shapeFill, shapeRadius, shapeLockAspect, activeTool]   # activeTool 이 마지막으로 복원
    restore: "saved[k]!==undefined 인 키만 session.setSetting, 키별 try/catch 로 손상 값은 무시하고 다음 키 계속. 값 검증은 setSetting(validate_setting) 담당"
    persist: "SETTINGS_CHANGED 마다 250ms 후행 디바운스(타이머 리셋)로 9키 전체 저장"
    recent: "loadRecentColors: 배열이면 string 만 필터 후 slice(0,8). 정규화/검증 안 함(표시 시 normHex 실패 → 빈 칸). RECENT_MAX=8(ui.md 의 32 는 구버전). 저장 시 normHex 값만"
    storeJson_loadJson: "모든 오류 무시. JSON 손상 → None"
    collapsed_panels_bug: "JS 는 attachSettingsPersist 가 dt.settings.v1 을 9키만으로 통째로 덮어써 collapsedPanels 를 지움(collapsible_sections.js:30-35 가 같은 키에 병합 저장 → 다음 설정 변경 때 소실). D9: 수정 — 병합 저장"
    schema_example: '{"primaryColor":"#000000","secondaryColor":"#ffffff","penSize":1,"gridMode":"off","snapUnit":false,"shapeFill":"outline","shapeRadius":8,"shapeLockAspect":false,"activeTool":"pen","collapsedPanels":{"dt-color-panel":true}}'
  design:
