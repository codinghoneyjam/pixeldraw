# Phase 3 — UI 전면 이식 (docs/native_plan.md §6 Phase 3: 3.1~3.10)
# 선행: index.yaml, phase2.yaml(W8 머지). 원천: JS src/ui/**, src/features/{color,layers,pen,shape,viewport,arc,gradient,text}/panel_*.js.
# 이 파일의 JS 사실은 전부 서브에이전트가 해당 JS 파일을 직접 읽어 추출한 것(verified). 문서(ui.md 등)와 코드가 다르면 코드가 정답(index.known_doc_code_discrepancies).

phase: 3
goal: "JS UI 의 모든 패널·메뉴·다이얼로그·설정/자동저장을 egui 로 이식. 기존 저장 파일을 열었을 때 레이어/색상/히스토리 동일"
gate: {doc: docs/native_smoke.md (UI 항목 추가), parity: "JS 가 저장한 샘플(.draw.json)을 앱 경로로 로드 → 레이어 수/이름/불투명도/블렌드/색 슬롯 동일"}

# ──────────────────────────────────────────────────────────────────────────────
architecture:
  layout: |
    crates/app/src/ui/
      mod.rs(파사드) state.rs(UiState: 패널별 하위 상태 한 줄씩) theme.rs strings.rs toast.rs tooltip.rs collapsible.rs panel_sizes.rs icons/ (path 파서+painter)
      menubar/ toolbar/ optionbar/ color/ layers/ status/ dialogs/ actions/ settings_store.rs autosave/
  ownership_rule: |
    패널 에이전트는 `fn show(ui: &mut egui::Ui, app: &mut AppState)` 형태이며 AppState 를 통해서만 세션을 건드린다.
    AppState 필드 추가 금지(공유). 대신 3.8 이 `UiState` 를 선행 정의하면서 패널마다 `pub <panel>: <panel>::State` 한 줄과 빈 `State` struct 를 미리 만들어 둔다 → 각 패널 에이전트는 자기 State 만 채움.
    AppState 에 새 공유 상태가 필요하면 수정하지 말고 log_draft.requests 로 반환(오케스트레이터가 W8 소유 파일에 반영).
  actions: "action id(문자열 25개, JS action_map.js)는 enum Action 으로. 메뉴·단축키·툴바가 같은 Action 큐로 합류. 큐 소비는 3.1a. 오류 정책(JS runAction): DrawToolError → session.notify('error', e.message, e.code), 그 외 → STRINGS.toast.unexpected + log::error"
  busy_flag: "다이얼로그 열림 또는 진행 바 표시 중 = busy. busy 면 단축키 무시, 상단 Undo/Redo 버튼 비활성(history_buttons.js: disabled = busy || !canUndo)"
  design_tokens:                   # style_base.css (verified by agent)
    colors: {bg: "#1e1f22", panel: "#2b2d31", panel2: "#232428", border: "#3a3d43", text: "#e6e6e6", text_dim: "#9aa0a6", accent: "#4cc2ff", accent_strong: "#1e88c7", danger: "#ff5c5c", warn: "#ffb020", canvas_bg: "#3c3f45", box_line: "#454a52", box_line_hi: "#565c66", sel_red: "#ff3b30", sel_black: "#000000"}
    sizes: {font_ui: 13, font_mono: 12, radius_button: 4, radius_container: 8, radius_swatch: "10%", gap: 8, button_min: "32x32", input_min_h: 28, optionbar_number_w: 64, toolbar_w: 44, panel_padding: 8, section_padding: 10, left_section_gap: 12, resize_handle: 8}
    layout: "행: 메뉴바(auto) / 옵션바(auto, min-h 40) / 본문(1fr) / 상태바(auto). 열: 툴바 44 | 좌 패널(기본 clamp(180px,20vw,260px)) | 핸들 8 | 캔버스 | 핸들 8 | 우 패널(기본 clamp(200px,22vw,320px))"
    container_chrome: "border #454a52 1px, radius 8, fill #232428, 상단 inset 하이라이트 rgba(255,255,255,.055), 하단 외곽 rgba(0,0,0,.38). 패널 헤더: 11px bold 자간 0.06em #9aa0a6, ▼ 삼각 + 우측 헤어라인 #454a52"
    motion_optional: "버튼 120ms 페이드, 눌림 scale .96, 툴바 선택 300ms 펄스, 토스트 180ms 슬라이드 — 전부 선택 사항(prefers-reduced-motion 이면 제거)"
  font_glyph_risks:
    - "한글: W7 폰트 로더 사용(D3)"
    - "이모지 👁🚫🔒🔓 (panel_layers.js:170,195)와 기호 ↶ ↷ ⧉ ⬇ ↑ ↓ − ◐ ● 는 egui 기본 폰트 커버리지 불확실(?). 안전책: icons.js 의 eye/eyeOff/lock/unlock SVG 경로를 직접 그린다(JS 는 안 쓰지만 icons.js:19-22 에 존재)"
    - "icons.js 경로가 SVG 호(a) 명령을 씀(arc/chord/hand/eyeOff/fill 등) → 직접 path 파서(M L H V C S Q T A Z) 또는 resvg/usvg(egui_extras svg) 필요. 선택은 3.2a 가 하고 근거를 로그에"

waves:
  - {wave: A, mode: parallel, needs: [phase2.W8], tasks: ["3.8 shared", "3.9 settings_store", "3.10a autosave_core", "3.4a color_math", "3.6a status_format", "3.1b shortcuts", "3.2a icons"]}
  - {wave: B, mode: parallel, needs: ["3.8"], tasks: ["3.1a menubar+actions", "3.1c file_actions", "3.2b toolbar", "3.3a~3.3f optionbar", "3.4b~3.4f color/brush", "3.5a~3.5c layers", "3.6b statusbar", "3.7a~3.7e dialogs"]}
  - {wave: C, mode: serial,   needs: [wave B, "3.9", "3.10a"], tasks: ["3.10b autosave 연결 + 복원 다이얼로그", "phase 3 게이트"]}
dependency_graph: |
  W8 ─> 3.8 ──┬─> 3.1a ─┐          3.9 ─────┬──────────────> 3.10b ─> gate
              ├─> 3.1c ─┤          3.10a ───┘                 ▲
              ├─> 3.2b ─┤  (3.2a icons ─> 3.2b, 3.5)         │
              ├─> 3.3* ─┤  3.4a ─> 3.4c,3.4d,3.4e            │
              ├─> 3.4* ─┼──────────────────────────────> gate
              ├─> 3.5* ─┤  3.1b ─> 3.1a(키 처리 호출)
              ├─> 3.6b ─┤  3.6a ─> 3.6b
              └─> 3.7* ─┘  3.7 ─> 3.10b(복원 다이얼로그)

# ══════════════════════════════════════════════════════════════════════════════
tasks:

- id: "3.8"
  title: shared — strings · toast · tooltip · collapsible · panel_sizes · theme · UiState 선행 정의
  wave: A
  serial_before_panels: true
  write_scope: ["crates/app/src/ui/{mod,state,theme,strings,toast,tooltip,collapsible,panel_sizes}.rs", crates/app/src/lib.rs(ui 선언)]
  read_first: [src/ui/shared/strings.js, toast.js, tooltip.js, collapsible_sections.js, panel_resize.js, style_base.css(토큰), "docs/roadmap/phase3.yaml architecture"]
  deliverables:
    strings: |
      pub mod strings: STRINGS 트리를 const 모듈로. JS 키 이름 유지. 카탈로그 외에 dialog_core/dialog_new_doc/panel_layers/color 의 하드코딩 문자열도 이 한 곳으로 수집(JS 는 흩어져 있음 — 각 패널 에이전트가 자기 문자열을 추가할 수 있게 하되 같은 파일을 동시에 편집하지 않도록 `strings/` 디렉터리 + 패널별 파일(strings/menus.rs, dialogs.rs, layers.rs, color.rs …)로 분리하고 mod.rs 가 pub use).
      원문(verified): menus 파일/편집/보기/레이어 · blends normal=보통 multiply=곱하기 screen=스크린 overlay=오버레이 darken=어둡게 lighten=밝게
      hints penEraser='Shift+클릭 = 직선, Alt+클릭 = 스포이트(펜)' · fill='클릭한 영역을 주색으로 채웁니다 (4방향, 허용오차 0)' · eyedropper='클릭 = 주색, Shift+클릭 = 보조색, Alt = 활성 레이어 기준' · hand='드래그로 화면 이동, 휠로 확대/축소' · shape='드래그로 그린 뒤 Enter 확정, Esc 취소'(미사용) · polygon='클릭으로 정점 추가, 첫 정점 클릭·Enter 확정, Esc 한 점 되돌리기'(미사용)
      tools pen=펜 eraser=지우개 fill=페인트통 eyedropper=스포이트 line=직선 rect=사각형 rrect=둥근 사각형 ellipse=타원 polygon=다각형 hand=손 (10종뿐 — arc/chord/radial_gradient/text 는 없어 상태바에 영문 id 가 나옴: D10 패리티)
      color panel=색상 primary=주색 secondary=보조색 swap='주/보조 교체 (X)' reset='기본색 (D)' hex=HEX palette=팔레트 recent='최근 색' · layers opacity=불투명도 show=표시 hide=숨기기 lock=잠금 unlock='잠금 해제' rename='이름 바꾸기 (더블클릭)' · status.dirty='●'
      STRINGS.actions 라벨(예 '새로 만들기')과 메뉴 항목 실제 텍스트('새로 만들기 (Ctrl+N)')가 다름 → 메뉴 텍스트는 index.html 기준(3.1a 가 읽는다)
      msg(key, fallback): 최상위 키 없으면 fallback
    toast: |
      Toast{text, level: Info|Warn|Error, expires}. 수명: Error 8000ms, 그 외 4000ms (Warn 도 4000 — 상태바 warn 8000 과 다름 주의). 우하단 스택(right 16, bottom 48), 열 방향, gap 8, 새 항목이 아래에 append, 최대 개수/중복 제거 없음.
      스타일: fill #232428 + border #454a52 radius 8, warn border #ffb020, error border #ff5c5c, 등장 180ms translateY(8→0)+fade(선택).
      소비: AppState.toasts(Vec). 생산자 = 파일 액션(성공/경고), STATUS_MESSAGE 중 warn/error 만(ui/app.js:164-167) — info 는 상태바에만.
    tooltip: "옵션바 '?' 트리거용. TIP_AUTO_HIDE_MS=2500, GAP 6, MARGIN 8, MAX_TEXT 400(slice). 호버/포커스=임시, 클릭=고정(다시 클릭하면 닫힘), Esc/바깥 클릭/타이머에 닫힘, 동시에 1개. 단순화(on_hover_text)로 충분하면 그렇게 하되 pin/2500ms 패리티가 필요하면 상태 보관. 위치 규칙은 JS(트리거 아래, 우측 넘침 시 vw-w-8, 아래 넘침 시 위쪽) — egui 가 자동 처리하는 부분은 생략 가능"
    collapsible: "섹션 id: dt-color-panel, dt-palette-panel, dt-recent-panel, dt-brush-panel, dt-layer-panel. 상태 {id: bool(접힘)} 영속(3.9). 기본 전부 펼침; 복원은 stored[id]===true 일 때만 접힘. 헤더 라벨: 색상 팔레트 '최근 색' 브러시 레이어. onExpand(→ refreshPanelCanvases)는 egui 에서 불필요"
    panel_sizes: |
      순수 함수 + 테스트(panel_resize.js 수식 그대로):
      MAX_PANEL_WIDTH=440, GUTTER_WIDTH=16. min: 기본 left 180 / right 200; window≤720 → 130; ≤360 → 96. canvasMinWidth: 기본 220, ≤720 → 48, ≤360 → 40.
      max = max(min, min(440, appWidth − toolbarWidth − minWidth(otherSide) − canvasMin − 16)).
      clampPanelWidth(v,min,max) = round(min(max, max(min, Number(v)||min))).
      한쪽을 키우면 반대쪽을 (totalCapacity − width) 로 줄이되 min 아래로는 안 줄임(setWidth L55-80). 1px 이상 변하면 반대쪽도 explicit 로 승격·저장.
      저장 키 dt.panelWidths.v1 = {left?:int, right?:int} — 사용자가 명시적으로 조절한 쪽만(explicit 집합), px 반올림.
      키보드: ←/→ 10px(left 는 → 가 증가, right 는 ← 가 증가), Home=min, End=max; 키 입력 즉시 persist. 드래그 부호: left 는 currentX−startX, right 는 startX−currentX.
      기본 폭(미저장): left clamp(180px,20vw,260px), right clamp(200px,22vw,320px). aria 문구: '왼쪽 패널 너비 조절','오른쪽 패널 너비 조절','드래그 또는 방향키로 너비 조절'. (index.html aria-valuemax 420 vs 코드 MAX 440 → 코드 기준)
      egui SidePanel::width_range 와 같은 결과를 내려면 매 프레임 계산(반대쪽/툴바/캔버스 최소폭 연동).
    ui_state: "UiState{ menubar: menubar::State, toolbar: .., optionbar: .., color: .., brush: .., layers: .., status: .., dialogs: .., collapsed: HashMap<String,bool>, panel_widths: PanelWidths, recent_colors: Vec<String> } — 패널 State 는 각 모듈의 빈 `#[derive(Default)] pub struct State;` 로 선행 생성(모듈 파일도 빈 스텁으로 선행 생성하여 이후 에이전트가 같은 파일을 새로 만들지 않음)"
  tests: ["panel_sizes 수식 표(JS 테스트 tests/panel_resize 있으면 포팅)", "toast 수명/스택", "strings 키 존재 핀"]

