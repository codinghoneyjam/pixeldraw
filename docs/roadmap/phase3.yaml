- id: "3.7"
  title: dialogs — 모달 셸 + 5종 (3.7a~3.7e)
  wave: B
  needs: ["3.8"]
  write_scope: ["crates/app/src/ui/dialogs/**"]
  shell: "egui::Modal 또는 Area+반투명 배경 rgba(0,0,0,.5). 박스 min-width 320, max-width 480, padding 16, 버튼 우측 정렬 gap 8, 위 마진 12. Esc 와 바깥 클릭 → close(null). 첫 focusable 에 초기 포커스(confirm='취소', restore='버리기', export-format='픽셀 청크 JSON'). 닫힌 뒤 결과 전달은 1회 보장(settled). root 없는 환경 폴백(confirm=false, restore='discard', export-format=None)은 테스트용"
  subtasks:
    - {id: "3.7a", file: "dialogs/new_doc.rs", what: "초기 wTiles=8,hTiles=8,background='transparent',name='Untitled'. TILE_MIN=0.5, TILE_MAX_W=2048/64=32, TILE_MAX_H=1088/64=17, step 0.5. wPx=round(w*64). ok = w>=0.5&&w<=32&&finite 그리고 32<=wPx<=2048&&32<=hPx<=1088&&wPx%32==0&&hPx%32==0(예: 0.75타일=48px 은 거부). 빈 입력 Number('')=0 → 거부. 만들기 disabled=!ok. 오류문 `범위: 너비 0.5–32, 높이 0.5–17 타일 (32px 배수 결과 필요)`(en dash). px 안내 `${wPx} × ${hPx} px`. 프리셋(라벨,wTiles,hTiles): ['1슬롯 128×128',2,2],['16슬롯 512×512',8,8],['64슬롯 1024×1024',16,16],['풀HD 1920×1088',30,17]; 프리셋 줄 맨 위. 필드 순서: 프리셋→너비(타일)→높이(타일)→문서 이름→배경→px안내→오류문. 배경 옵션 transparent/투명, #ffffff/흰색, #000000/검정. 결과 {widthPx,heightPx,background,name: String(name||'Untitled')}(이름 trim 안 함). 버튼 [취소,만들기]"}
    - {id: "3.7b", file: "dialogs/resize.rs", what: "검증 Number.isInteger(w,h) && 32<=w<=2048 && 32<=h<=1088 && w%32==0 && h%32==0; step=32. 오류문 `32–2048 × 32–1088, 32의 배수여야 합니다`. 라벨 '너비(px, 32px 배수)','높이(px, 32px 배수)'. 버튼 [취소,확인]. 초기값=현재 캔버스 크기. 엔진 ResizeCanvasCommand 가 is_valid_canvas_size 로 재검증, 실패 CANVAS_SIZE_INVALID"}
    - {id: "3.7c", file: "dialogs/confirm.rs", what: "'변경 버리기' / '저장하지 않은 변경이 있습니다. 버리시겠습니까?' [취소,버리기]. v===true 만 true"}
    - {id: "3.7d", file: "dialogs/restore_export.rs", what: "자동저장 복원: 제목 '자동저장 복원', 본문 '자동저장된 문서'+(name? ` \"${name}\"`:'')+(when? ` (${when})`:'')+'가 있습니다. 복원하시겠습니까?' when=updatedAt 로컬 시각 문자열(로케일 의존 — Rust 는 chrono 없이 std 로 포맷하거나 'YYYY-MM-DD HH:MM:SS' 로 고정하고 로그). 버튼 [버리기,복원]; v==='restore' 만 restore, 나머지(Esc·바깥 클릭 포함)는 'discard'(D8: 자동저장 삭제 UX 패리티). 레이어 저장 형식: 제목 '레이어 저장 형식', 본문 '픽셀 청크는 무손실이며, 명령 형식은 현재 픽셀을 rect/pixel 명령으로 근사합니다.', 버튼 [픽셀 청크 JSON(chunks), 명령 레이어 JSON(commands), 취소(None)]"}
    - {id: "3.7e", file: "dialogs/progress.rs", what: "하단 중앙(bottom 48) 라벨+트랙 240×8(#232428) 채움 #4cc2ff. update(v): clamp 0..1 → width % = round(v*100). close 멱등. 열려 있는 동안 busy(단축키/undo·redo 잠금)"}
  tests: ["new_doc 유효성 표(0.5/0.75/32/33/NaN/빈/1920×1088 프리셋)", "resize 표", "결과 변환 규칙(restore 외 전부 discard)", "버튼 순서/초기 포커스", "진행 clamp"]

- id: "3.10b"
  title: autosave 연결 — 시작 시 복원 흐름 + 플러시 트리거
  wave: C
  needs: ["3.9", "3.10a", "3.7d"]
  write_scope: ["crates/app/src/ui/autosave_glue.rs", crates/app/src/session_glue.rs(훅 추가 — W8 소유, 확장만)]
  boot_order_js: "ui/app.js L81-158: restoreSettings → loadRecentColors → AutosaveStore.open/peek → 복원 다이얼로그 → (미복원 시) newDocument(DEFAULT_DOC 512×512 transparent) → 도구 등록 → renderer/input → viewStore.fit() → viewStore.subscribe(render) → buildActions → menubar/toolbar → status → color/brush/layers/options/collapsible/panelResize → attachSettingsPersist → store.attach. 복원 시 loadDocument(doc,{markSaved:false}) → 복원 직후 dirty ●. 복원 외 모든 결과는 store.clear()(자동저장 삭제). store.attach 는 패널 mount 뒤(첫 문서는 attach 전이라 첫 변경 전까지 기록 안 됨)"
  window_close: "beforeunload: history.is_dirty() 면 닫기 차단 → egui close_requested 에서 취소하고 confirm 다이얼로그(문구는 JS 에 없음 → 3.7c '변경 버리기')"
  tests: ["부팅 시나리오: 자동저장 없음/있음+복원/있음+버림(삭제)/손상(삭제 후 기본 문서)", "복원 후 dirty=true", "attach 전 이벤트는 기록되지 않음", "종료 시 flush"]

