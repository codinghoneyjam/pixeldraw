# ──────────────────────────────────────────────────────────────────────────────
global_rules:
  R1_disjoint_writes: "각 작업은 자기 write_scope 밖을 수정하지 않는다. 밖이 막으면 수정하지 말고 로그 초안의 blocked 에 적고 멈춘다. 공유 파일(lib.rs, Cargo.toml, contract.md, tools/api.rs, input/event.rs, tools/overlay.rs)은 W0 소유"
  R2_module_size: "300줄 이상 검토, 400줄 하드리밋(테스트 포함). 넘으면 파사드 분할: foo.rs(mod + pub use 만) + foo/. 예외: recipe/commands.rs 등 기존 예약 면제"
  R3_comments: "주석은 트랩만(JS 패리티, 실측 수치, 일부러 안 고친 이유, 비트 동일성 지탱 연산 순서). 긴 설명은 docs/*.md. 코드를 되풀이하는 주석 금지"
  R4_constants: "새 숫자 상수는 docs/contract.md 표에 먼저 올리고 engine/src/constants.rs 에 const 로 두고 constants 테스트에 핀. 모듈에 하드코딩 금지"
  R5_gates: |
    작업 종료 시 모두 실행하고 전→후 수치를 로그 초안에 적는다:
      cargo test --workspace
      cargo clippy --workspace --all-targets -- -D warnings
      cargo fmt --all --check
    JS 를 건드린 작업만 추가: npm test (410/410), node tools/oracle_manifest.mjs --check
    병렬 웨이브 중에는 자기 크레이트만: cargo test -p <crate> <module_path>. 전체 게이트는 웨이브 종료 시 오케스트레이터
  R6_log_protocol: "에이전트는 docs/progress/{README,log}.md 를 수정하지 않는다. 최종 메시지에 log_draft(YAML: task, tests_before_after, files, discoveries, blocked, decisions_taken)를 반환. 오케스트레이터가 합쳐 기록(README 규칙 1,4)"
  R7_no_commit: "커밋·브랜치 생성 금지(사용자 요청 시에만). 커밋 대상 경로는 docs/progress/README.md '커밋 대상 경로'"
  R8_js_readonly: "src/ tests/ reference/ 는 읽기 전용. 새 오라클은 tools/*.mjs + tools/*.json 으로 추가(oracle-manifest 재생성 금지: tests/fixtures.rs:89-95 가 manifest 키를 단언)"
  R9_parity_first: "JS 동작을 복제한다. 더 나은 동작이 보여도 바꾸지 않고 log_draft.discoveries 에 적는다. 의도적 deviation 은 명세에 allowed_deviation 으로 명시된 것만"
  R10_user_strings: "사용자 노출 문자열(토스트·라벨·상태)은 JS 원문과 글자 단위 동일. 번역·교정 금지. 문자열은 app/src/ui/strings.rs 한 곳(3.8)으로 모이기 전까지는 각 모듈 상단 const"
  R11_unread_js: "명세가 '읽지 않음'이라 표시한 JS 는 작업 시작 시 먼저 읽는다. 명세와 어긋나면 JS 가 우선"
  R12_tests_no_sleep: "테스트에서 wall-clock 시간 단언 금지. 시간 의존 로직은 Instant/Duration 주입(예: CompCache budget)"

# ──────────────────────────────────────────────────────────────────────────────
orchestration:
  wave_protocol:
    - "오케스트레이터가 웨이브의 모든 작업을 한 번에 스폰(병렬). 각 작업에는 index.yaml + 해당 phase 파일의 자기 항목만 전달"
    - "에이전트는 자기 범위 테스트만 돌리고 log_draft 반환"
    - "웨이브 종료: 오케스트레이터가 cargo test --workspace + clippy + fmt 1회, 로그·보드 갱신, (사용자 승인 시) 커밋"
  spawn_message_template: |
    프로젝트 pixeldraw. docs/roadmap/index.yaml 의 global_rules 와 docs/roadmap/<phase>.yaml 의 task <ID> 를 읽고 구현해라.
    write_scope 밖 파일 수정 금지. docs/progress/* 수정 금지. 커밋 금지. 끝나면 log_draft(YAML)를 최종 메시지로 반환.
  agent_sizing: "W1,W5,W6,W8 = 어려움(소유권/상태 머신). W2,W3,W4 = 중간(JS 패리티 정밀). W7,W9 = 쉬움~중간(외부 API 확인 필요). 어려움은 큰 모델 권장 (list_agents_and_models 로 id 확인)"
  review_hooks: "웨이브 2·3 끝에 서브에이전트 리뷰 1회(변경 파일 diff + 해당 JS 원본 대조). 리뷰어는 읽기 전용"

