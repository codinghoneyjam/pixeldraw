# ──────────────────────────────────────────────────────────────────────────────
translation_conventions:          # JS → Rust 공통 번역 규약. 모든 phase 공통
  events:
    js: "session.addEventListener(EVENTS.X, fn) — 구독자가 세션·도구에 자유 접근"
    rust: "Session::subscribe(FnMut(&ModelEvent)->EngineResult<()> + 'static). 콜백에서 세션/도구 접근 불가 → 큐에 push 후 프레임 루프에서 drain"
    pattern: |
      let q: Rc<RefCell<VecDeque<ModelEvent>>> = Default::default();
      let q2 = q.clone();
      session.subscribe(move |ev| { q2.borrow_mut().push_back(ev.clone()); Ok(()) });
      // 프레임/입력 처리 직후: while let Some(ev) = q.borrow_mut().pop_front() { comp_cache.apply_event(&ev); tools.on_model_event(&ev, &mut cx); … }
    ordering_trap: "JS dispatchEvent 는 동기. 큐 drain 은 지연되므로 (1) 모든 입력 처리 직후 즉시 drain (2) 프레임 시작에도 drain. 도구는 이벤트 수신 시점에 settings/doc 가 이미 더 진행됐을 수 있음을 가정(캡처된 layer_id/color 를 쓰는 ShapeTool 은 영향 없음)"
    emit_inside_drain: "drain 중 도구가 session 을 변경해 새 이벤트가 생기면 큐 뒤에 붙는다. 무한 루프 방지: drain 1회 최대 N(=1024)개, 초과 시 log::error 하고 다음 프레임으로"
  errors: "DrawToolError{code,message,details}. 엔진 코드 카탈로그는 21종(errors.rs CATALOG; contract.md 는 19종 — 코드가 정답). 입력 경로에서 Err 은 삼키지 않는다: session.notify('error', e.message, e.code) — JS runAction 정책(ui/app.js)"
  numbers: "JS number → Rust: 픽셀/좌표 i32, 캔버스 크기 u32, 청크 (u32,u32), 뷰/실수 f64. JS Number.isInteger 가드는 타입이 대신함(OUT_OF_RANGE 도달 불가). >>>0 은 u32. Math.round = (v+0.5).floor() (음수 .5 는 위로: Math.round(-0.5)=-0 → 0). Rust f64::round 는 .5 를 0에서 멀리 → 사용 금지, 엔진 view::geom::round_half_up / blend::rnd 사용"
  colors: "hex 문자열 '#rrggbb'|'#rrggbbaa'. engine::pixel::{parse_hex, to_hex8(f64 x4), pack_rgba(f64 x4), pack_rgba_bytes(u8 x4), unpack_rgba}. 알파 0 은 parse 결과 a=0 이면 무효 취급하는 곳이 있음(normHex)"
  settings_api: "Session::settings() -> Settings(복사본: primary_color: String, secondary_color, pen_size: u32, active_tool: &'static str, grid_mode, snap_unit: bool, shape_fill: &'static str, shape_radius: u32, shape_lock_aspect). 쓰기: set_setting(key:&str, SettingInput::{Str,Num(f64),Bool}) -> EngineResult<bool>(변경 여부). 이벤트 payload: EventDetail::Settings{key: SettingKey, value: SettingValue::{Color,Int(u32),Bool,Mode(&'static str)}}"
  layers_api: "model::operations::* 와 Session 위임 12개(add_layer/duplicate_layer/remove_layer/move_layer/merge_down/insert_layer/resize_canvas/rename_layer/set_layer_visible/locked/opacity(id,v,final_)/blend/set_active_layer) + model::actions::{layer_add,layer_duplicate,layer_remove,layer_merge_down,layer_up,layer_down}. 문서: Session::doc()->Option<&Document>; Document{id,name,canvas:CanvasInfo{width_px,height_px,background..},layers:Vec<Layer>(0=맨아래),active_layer_id,ids}"
  notify_code: "JS session.notify(level,text,code) 의 code 는 생략 시 undefined. Rust Session::notify(level:&'static str, text, code:&'static str) → 코드 없는 호출('투명 픽셀', '이미 같은 색입니다' 등)은 code=\"\" 로 통일. 상태바/토스트는 level·text 만 사용(ui/app.js: warn/error 만 토스트)"
  tool_state_string: "Session::emit_tool_state(tool, pending:String). pending 은 도구가 직렬화한 문자열 = 계약(ShapeTool 이 {pending,vertices} 의 JSON 문자열로 변경 감지). serde_json::to_string, 키 순서 = 구조체 필드 선언 순서"

