[package]
name = "pixel-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A pure engine: this crate must stay free of GPU, OS and network types exactly
# like `src/core/**` and `src/features/document/**` were DOM-free in the JS tree
# (docs/contract.md §4). Tests run under plain `cargo test` — no browser, no
# wasm, no DOM shim.
#
# The two "outside" crates are both codecs, not capabilities: `flate2` replaces
# `CompressionStream("deflate")` for PNG's IDAT, and `base64` replaces the
# browser's `btoa`/`atob` bridge for chunk payloads. Neither touches the OS.
#
# `rayon` is a third kind of "outside": a thread pool. It is here because
# compositing and flattening are embarrassingly parallel over chunk rows and the
# CPU is not the bottleneck a single core can carry. It is used only behind an
# explicit serial twin, so the parallelism is always measurable on its own, and
# every public parallel entry point has a single-threaded sibling that produces
# identical bytes — the rayon's own scheduler sizes itself from the host, so no
# CPU feature detection is involved anywhere.
[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1.1"
rayon = "1.10"

[dev-dependencies]
# Re-derives the `hashes` group of raster_golden.json (masks too big to inline as
# rows) so Phase 1.4 can check brush 64/33, ellipse 128x64 and the big
# rrect/outline masks without leaving a case unverified.
sha2 = "0.10"

[lints]
workspace = true
